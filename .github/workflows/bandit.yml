name: Bandit

# Python security lint over the shipped agent code. The policy -- what fails
# this job and how a finding may be suppressed -- is in CONTRIBUTING.md
# ("Security checks"); the global skips and their reasons are in
# pyproject.toml under [tool.bandit].
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes its running check. Runs for
# main are grouped per commit, so a burst of merges cannot cancel one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The version bandit-requirements.txt was compiled for.
          python-version: '3.12'

      - name: Install Bandit (hash-pinned)
        run: python -m pip install --require-hashes --no-deps -r .github/bandit-requirements.txt

      # A bare `# nosec` -- or one naming a test ID Bandit does not have --
      # silences every check on its line, including ones added later. Each
      # suppression must name a real test and say why: `# nosec B110  # <reason>`.
      - name: Check the policy config and every suppression
        run: sh ci/check-nosec.sh

      # A check that is only ever seen passing proves nothing, and Dependabot
      # bumps Bandit monthly: prove it still rejects what it exists to catch.
      - name: Check the check still rejects bad suppressions
        run: |
          for case in unknown-id bare no-reason bandit-ini; do
            canary=$(mktemp -d)
            case "$case" in
              unknown-id) line='os.system("ls " + os.environ["X"])  # nosec B999  # canary' ;;
              bare) line='os.system("ls " + os.environ["X"])  # nosec' ;;
              no-reason) line='os.system("ls " + os.environ["X"])  # nosec B605' ;;
              bandit-ini)
                line='os.system("ls " + os.environ["X"])'
                printf '[bandit]\nskips: B605\n' > "$canary/.bandit" ;;
            esac
            printf 'import os\n%s\n' "$line" > "$canary/canary.py"
            if sh ci/check-nosec.sh bandit "$canary" > /dev/null; then
              echo "::error::ci/check-nosec.sh accepted a suppression it must reject: ${case}"
              exit 1
            fi
          done
          # And a widened [tool.bandit] table. The script reads pyproject.toml
          # from the directory it runs in, so this one runs from a copy.
          cfg=$(mktemp -d)
          mkdir "$cfg/pkg"
          echo 'x = 1' > "$cfg/pkg/a.py"
          sed 's/^skips = .*/skips = ["B404", "B603", "B607", "B605"]/' pyproject.toml > "$cfg/pyproject.toml"
          if (cd "$cfg" && sh "$GITHUB_WORKSPACE/ci/check-nosec.sh" bandit pkg) > /dev/null 2>&1; then
            echo "::error::ci/check-nosec.sh accepted a [tool.bandit] table that skips B605"
            exit 1
          fi
          echo "ci/check-nosec.sh rejects all five canaries."

      - name: Run Bandit
        run: bandit -c pyproject.toml -r fivenines_agent

      - name: List suppressions in the run summary
        if: always()
        run: |
          {
            echo "### Bandit suppressions"
            echo
            echo "Skipped globally (reasons in pyproject.toml): \`$(grep -E '^skips' pyproject.toml)\`"
            echo
            echo "Suppressed inline, each with its reason:"
            echo
            echo '```'
            grep -rn '# nosec' fivenines_agent | sort -t: -k1,1 -k2,2n \
              | sed -E 's/^([^:]+:[0-9]+):.*# nosec (B[0-9]{3})  # (.*)$/\1  \2  \3/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
