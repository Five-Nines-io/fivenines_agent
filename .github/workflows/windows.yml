name: Windows Build

# Windows CI for the agent: tests, frozen-binary build, MSI build, and the
# end-to-end install smoke (D14 + D20 - CI is the quality gate for the
# single combined release).
#
# build-release.yml calls this workflow on a v* tag (workflow_call) and its
# release job waits for it, so a release whose MSI fails the member-server
# E2E is never published. It therefore does not trigger on tags itself.
#
# Coverage handling per D3: the per-OS pytest run uses --cov but NOT
# --cov-fail-under (Windows alone cannot reach 100% because Linux-only
# branches are unreachable here, and vice versa on the Linux CI in
# build-release.yml). The combined-coverage gate that merges both OS runs
# is a follow-up; tracked in TODOS.md. For now, the per-OS coverage XML is
# uploaded as an artifact so it can be aggregated externally.

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'spuyet/windows-server-support'
  workflow_call:
  workflow_dispatch:
    inputs:
      domain_controller:
        description: "Also run the MSI E2E on real domain controllers (Server 2019 VMs, English and German, ~1h)"
        type: boolean
        default: false

# A literal group, not github.workflow: in a called workflow that names the
# CALLER, and sharing build-release.yml's group would make the call wait for
# its own caller.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Nothing here writes to the repository, whatever the default token allows.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  # Poetry and the other build tools are pinned, with hashes, in
  # ci/requirements/build-tools.txt.
  # WiX 5+ - need the <Files> harvesting element, which WiX 4 does not have.
  # Pinned to a stable 5.x so the schema we author against stays predictable;
  # WiX 6/7 introduce further changes (e.g. some default behavior shifts).
  WIX_VERSION: '5.0.2'
  # WinSW v2 (.NET Framework 4 - in-box on Server 2019/2022/2025 + Win 10/11)
  WINSW_VERSION: '2.12.0'
  WINSW_URL: 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe'
  # SHA256 of WinSW.NET4.exe v2.12.0 published binary. Verified against the
  # GitHub release artifact via multiple consecutive green CI runs.
  WINSW_SHA256: '923111C7142B3DC783A3C722B19B8A21BCB78222D7A136AC33F0CA8A29F4CB66'

jobs:
  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools (hash-pinned)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r ci/requirements/build-tools.txt

      - name: Install dependencies (windows group, virtualization excluded)
        shell: pwsh
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --without virtualization --with windows --with test

      - name: Run tests with coverage (no fail-under per D3)
        shell: pwsh
        run: |
          poetry run pytest tests/ `
            --cov=fivenines_agent `
            --cov-report=xml:coverage-windows.xml `
            --cov-report=term-missing

      # The MSI's password generator, exercised against the real PowerShell.
      # The bug this guards used to fail roughly one install in 770 - rare
      # enough to look like CI flake, frequent enough to be a customer's
      # failed install - and the E2E smoke job that eventually caught it only
      # runs after the MSI is built, so it never fenced the generator itself.
      # The function is extracted rather than dot-sourced because the script
      # is a custom action with mandatory parameters and Windows-only cmdlets.
      - name: Verify service-account password generation
        shell: pwsh
        run: |
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          foreach ($fn in 'Get-RandomIndex', 'Get-RandomChar', 'New-RandomPassword') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }

          # New-LocalUser enforces the machine password policy, which wants at
          # least three of {upper, lower, digit, non-alphanumeric}. Assert all
          # four on every draw, so a regression cannot reintroduce a rare miss.
          $seen = @{}
          for ($i = 0; $i -lt 2000; $i++) {
            $pw = New-RandomPassword
            if ($pw.Length -ne 32) { throw "length $($pw.Length), expected 32: $pw" }
            if ($pw -notmatch '[A-Z]')      { throw "no uppercase: $pw" }
            if ($pw -notmatch '[a-z]')      { throw "no lowercase: $pw" }
            if ($pw -notmatch '[0-9]')      { throw "no digit: $pw" }
            if ($pw -notmatch '[-_]')       { throw "no non-alphanumeric: $pw" }
            if ($pw -match '[^A-Za-z0-9_-]') { throw "character outside the sc.exe-safe alphabet: $pw" }
            $seen[$pw] = $true
          }
          if ($seen.Count -ne 2000) { throw "generated a duplicate password in 2000 draws" }

          # The guaranteed characters must not sit in a fixed order at the
          # front: that would leak four positions of the password's structure.
          $firstDigitPositions = @{}
          for ($i = 0; $i -lt 500; $i++) {
            $firstDigitPositions[(New-RandomPassword).IndexOfAny('0123456789'.ToCharArray())] = $true
          }
          if ($firstDigitPositions.Count -lt 10) {
            throw "first digit landed in only $($firstDigitPositions.Count) distinct positions - is the shuffle running?"
          }

          Write-Host "2000 passwords: length 32, all four character classes, no duplicates, shuffled."

      # The service-account rules, under Windows PowerShell 5.1 (the custom
      # actions' runtime). The domain-controller cases cannot run for real
      # here -- promoting a runner to a DC needs a reboot -- so the decision
      # lives in a pure function, Get-AccountPlan, exercised case by case.
      - name: Verify service-account rules (domain-controller cases included)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          foreach ($name in 'MSI_MANAGED_DESCRIPTION', 'DC_MANAGED_PREFIX', 'DC_OPERATOR_DESCRIPTION') {
            $m = [regex]::Match($src, ('(?m)^\${0} = ".*"' -f $name))
            if (-not $m.Success) { throw "`$$name not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }
          $m = [regex]::Match($src, "(?ms)^function Get-AccountPlan \{.*?^\}")
          if (-not $m.Success) { throw "Get-AccountPlan not found in CreateServiceAccount.ps1" }
          Invoke-Expression $m.Value

          # A SAM account comment (Description) holds at most 48 characters;
          # a NetBIOS computer name is at most 15.
          foreach ($d in @($MSI_MANAGED_DESCRIPTION, $DC_OPERATOR_DESCRIPTION, ($DC_MANAGED_PREFIX + ('X' * 15)))) {
            if ($d.Length -gt 48) { throw "Description over 48 characters: '$d'" }
          }

          # The uninstall script deletes a DC's account only when it carries
          # this DC's tag, so it must spell the prefix the same way.
          $uninstall = Get-Content fivenines_uninstall.ps1 -Raw
          foreach ($name in 'DC_MANAGED_PREFIX', 'MSI_MANAGED_DESCRIPTION') {
            $line = [regex]::Match($src, ('(?m)^\${0} = ".*"' -f $name)).Value
            if (-not $uninstall.Contains($line)) { throw "fivenines_uninstall.ps1 does not carry: $line" }
          }

          $own = $DC_MANAGED_PREFIX + "DC1"
          $other = $DC_MANAGED_PREFIX + "DC2"
          $script:failed = 0
          function Check($IsDc, $Exists, $Description, $HasPassword, $Action, $Tag, $Mentions) {
            $plan = Get-AccountPlan -IsDomainController $IsDc -Exists $Exists -Description $Description `
              -HasPassword $HasPassword -AccountName "fivenines-agent" -ComputerName "DC1"
            $label = "dc=$IsDc exists=$Exists description='$Description' password=$HasPassword"
            if ($plan.Action -ne $Action -or $plan.Description -ne $Tag) {
              Write-Host "FAIL $label -> $($plan.Action) '$($plan.Description)', expected $Action '$Tag'"
              $script:failed++
            } elseif ($Action -eq "Refuse" -and -not ($plan.Message -like "*$Mentions*")) {
              Write-Host "FAIL $label -> message does not mention '$Mentions': $($plan.Message)"
              $script:failed++
            } else {
              Write-Host "ok   $label -> $Action"
            }
          }

          # Member server / workgroup: the behavior every release had.
          Check $false $false ""                       $false "Create"      $MSI_MANAGED_DESCRIPTION $null
          Check $false $false ""                       $true  "Create"      $MSI_MANAGED_DESCRIPTION $null
          Check $false $true  $MSI_MANAGED_DESCRIPTION $false "Rotate"      $null $null
          Check $false $true  $MSI_MANAGED_DESCRIPTION $true  "UseProvided" $null $null
          Check $false $true  "Ansible-managed"        $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"
          Check $false $true  "Ansible-managed"        $true  "UseProvided" $null $null
          Check $false $true  ""                       $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"

          # Domain controller, fresh account: random password -> this DC's
          # tag; operator password -> shared, never rotated.
          Check $true $false ""                        $false "Create"      $own $null
          Check $true $false ""                        $true  "Create"      $DC_OPERATOR_DESCRIPTION $null

          # Domain controller, existing account, no password.
          Check $true $true  $own                      $false "Rotate"      $null $null
          Check $true $true  ($DC_MANAGED_PREFIX + "dc1") $false "Rotate"   $null $null
          Check $true $true  $MSI_MANAGED_DESCRIPTION  $false "Rotate"      $own $null
          Check $true $true  $other                    $false "Refuse"      $null "DC2"
          Check $true $true  $DC_OPERATOR_DESCRIPTION  $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"
          Check $true $true  "Ansible-managed"         $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"
          Check $true $true  ""                        $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"

          # Domain controller, existing account, operator password: an
          # installer-managed account becomes shared so nothing rotates it.
          Check $true $true  $own                      $true  "UseProvided" $DC_OPERATOR_DESCRIPTION $null
          Check $true $true  $other                    $true  "UseProvided" $DC_OPERATOR_DESCRIPTION $null
          Check $true $true  $MSI_MANAGED_DESCRIPTION  $true  "UseProvided" $DC_OPERATOR_DESCRIPTION $null
          Check $true $true  $DC_OPERATOR_DESCRIPTION  $true  "UseProvided" $null $null
          Check $true $true  "Ansible-managed"         $true  "UseProvided" $null $null

          # The uninstall's delete-or-keep rule, every tag on both roles.
          $m = [regex]::Match($uninstall, "(?ms)^function Test-UninstallDeletesAccount \{.*?^\}")
          if (-not $m.Success) { throw "Test-UninstallDeletesAccount not found in fivenines_uninstall.ps1" }
          Invoke-Expression $m.Value
          function CheckUninstall($IsDc, $Description, $Deletes) {
            $got = Test-UninstallDeletesAccount -IsDomainController $IsDc -Description $Description -ComputerName "DC1"
            $label = "uninstall dc=$IsDc description='$Description'"
            if ($got -ne $Deletes) { Write-Host "FAIL $label -> deletes=$got, expected $Deletes"; $script:failed++ }
            else { Write-Host "ok   $label -> deletes=$Deletes" }
          }
          CheckUninstall $false $MSI_MANAGED_DESCRIPTION $true
          CheckUninstall $false "Ansible-managed"        $true
          CheckUninstall $false ""                       $true
          CheckUninstall $true  $own                     $true
          CheckUninstall $true  ($DC_MANAGED_PREFIX + "dc1") $true
          CheckUninstall $true  $MSI_MANAGED_DESCRIPTION $true
          CheckUninstall $true  $other                   $false
          CheckUninstall $true  $DC_OPERATOR_DESCRIPTION $false
          CheckUninstall $true  "Ansible-managed"        $false
          CheckUninstall $true  ""                       $false

          if ($script:failed -gt 0) { throw "$($script:failed) service-account rule case(s) failed" }

      # The WMI Storage namespace delegation, for real on this runner: two
      # grants leave one ACE, the uninstall's removal takes it, and a grant
      # must work while the namespace still carries the ACE of a deleted
      # account (the object-form GetSecurityDescriptor failed on one, which
      # failed a reinstall with 1603 on a domain controller); an inherit-only
      # ACE is no grant, and the removal keeps deny ACEs.
      - name: Verify the WMI namespace delegation and its removal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $namespace = "root\Microsoft\Windows\Storage"
          $uninstall = Get-Content fivenines_uninstall.ps1 -Raw
          foreach ($fn in 'Get-WmiNamespaceSD', 'Set-WmiNamespaceSD', 'Remove-WmiStorageGrant') {
            $m = [regex]::Match($uninstall, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_uninstall.ps1" }
            Invoke-Expression $m.Value
          }
          function Get-GrantCount($Sid) {
            return @((Get-WmiNamespaceSD $namespace).DiscretionaryAcl | Where-Object {
              $_ -is [System.Security.AccessControl.KnownAce] -and $_.SecurityIdentifier.Value -eq $Sid }).Count
          }
          # Explicit ACEs for the SID of one kind ("AccessAllowed" or
          # "AccessDenied"), inherit-only (0x08, read as [int]: AceFlags is a
          # byte enum) or not.
          function Get-AceCount($Sid, $Qualifier, [bool]$InheritOnly) {
            return @((Get-WmiNamespaceSD $namespace).DiscretionaryAcl | Where-Object {
              $_ -is [System.Security.AccessControl.QualifiedAce] -and $_.SecurityIdentifier.Value -eq $Sid -and
              -not $_.IsInherited -and "$($_.AceQualifier)" -eq $Qualifier -and
              (((([int]$_.AceFlags) -band 0x08) -ne 0) -eq $InheritOnly) }).Count
          }
          function New-TestUser($Name) {
            $pw = ConvertTo-SecureString ("Aa1-" + [guid]::NewGuid()) -AsPlainText -Force
            New-LocalUser -Name $Name -Password $pw | Out-Null
            return (Get-LocalUser -Name $Name).SID.Value
          }

          try {
            $first = New-TestUser "fn-wmi-a"
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount "$env:COMPUTERNAME\fn-wmi-a"
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount ".\fn-wmi-a"
            if ((Get-GrantCount $first) -ne 1) { throw "two grants left $(Get-GrantCount $first) ACEs, expected 1" }
            Write-Host "Granted twice: one ACE."

            Remove-LocalUser -Name "fn-wmi-a"
            $second = New-TestUser "fn-wmi-b"
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount "fn-wmi-b"
            if ((Get-GrantCount $second) -ne 1) { throw "the grant over an orphaned ACE did not land" }
            Write-Host "Granted while the namespace carries a deleted account's ACE."

            Remove-WmiStorageGrant $second
            Remove-WmiStorageGrant $first
            if ((Get-GrantCount $second) -ne 0 -or (Get-GrantCount $first) -ne 0) { throw "Remove-WmiStorageGrant left an ACE" }
            Write-Host "Remove-WmiStorageGrant removed both, the orphaned one included."

            # An inherit-only allow ACE applies to the sub-namespaces only, so
            # it is no grant; and the removal takes the allow ACEs only,
            # keeping a deny ACE someone else set (it is left behind for the
            # deleted test account, which this runner never reuses).
            $third = New-TestUser "fn-wmi-c"
            $thirdSid = [System.Security.Principal.SecurityIdentifier]$third
            $sd = Get-WmiNamespaceSD $namespace
            $sd.DiscretionaryAcl.InsertAce(0, [System.Security.AccessControl.CommonAce]::new(
              [System.Security.AccessControl.AceFlags]"ContainerInherit, InheritOnly",
              [System.Security.AccessControl.AceQualifier]::AccessAllowed, 0x23, $thirdSid, $false, $null))
            $sd.DiscretionaryAcl.InsertAce(0, [System.Security.AccessControl.CommonAce]::new(
              [System.Security.AccessControl.AceFlags]::None,
              [System.Security.AccessControl.AceQualifier]::AccessDenied, 0x20, $thirdSid, $false, $null))
            Set-WmiNamespaceSD $namespace $sd
            if ((Get-AceCount $third "AccessAllowed" $true) -ne 1 -or (Get-AceCount $third "AccessDenied" $false) -ne 1) {
              throw "the inherit-only and deny test ACEs did not land as written"
            }
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount ".\fn-wmi-c"
            if ((Get-AceCount $third "AccessAllowed" $false) -ne 1) { throw "an inherit-only allow ACE was taken for a grant" }
            Write-Host "Granted over an inherit-only allow ACE, which is no grant."

            Remove-WmiStorageGrant $third
            if ((Get-AceCount $third "AccessAllowed" $true) + (Get-AceCount $third "AccessAllowed" $false) -ne 0) {
              throw "Remove-WmiStorageGrant left an allow ACE"
            }
            if ((Get-AceCount $third "AccessDenied" $false) -ne 1) { throw "Remove-WmiStorageGrant removed a deny ACE" }
            Write-Host "Remove-WmiStorageGrant removed both allow ACEs and kept the deny ACE."

            # An allow ACE without the whole mask (enable only) is no grant
            # either: the grant adds the full one, and the removal takes both.
            $fourth = New-TestUser "fn-wmi-d"
            $sd = Get-WmiNamespaceSD $namespace
            $sd.DiscretionaryAcl.InsertAce(0, [System.Security.AccessControl.CommonAce]::new(
              [System.Security.AccessControl.AceFlags]::None,
              [System.Security.AccessControl.AceQualifier]::AccessAllowed, 0x01,
              [System.Security.Principal.SecurityIdentifier]$fourth, $false, $null))
            Set-WmiNamespaceSD $namespace $sd
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount ".\fn-wmi-d"
            if ((Get-AceCount $fourth "AccessAllowed" $false) -ne 2) { throw "a partial-mask allow ACE was taken for a grant" }
            Remove-WmiStorageGrant $fourth
            if ((Get-AceCount $fourth "AccessAllowed" $false) -ne 0) { throw "Remove-WmiStorageGrant left a partial-mask allow ACE" }
            Write-Host "Granted over a partial-mask allow ACE; the removal took both."
          } finally {
            Remove-LocalUser -Name "fn-wmi-a" -ErrorAction SilentlyContinue
            Remove-LocalUser -Name "fn-wmi-b" -ErrorAction SilentlyContinue
            Remove-LocalUser -Name "fn-wmi-c" -ErrorAction SilentlyContinue
            Remove-LocalUser -Name "fn-wmi-d" -ErrorAction SilentlyContinue
          }

      # The agent-directory grant, for real on this runner: it lands once and
      # is then left alone, and a directory that is a junction, sits under
      # one, or is not a directory at all (a hard link to a file) is refused
      # without touching what it points at, while a link that already
      # reaches the grant is left as it is. The check stops at Root without
      # looking at Root itself, even when Root is a junction or is written
      # with a trailing backslash. A junction inside a granted directory keeps
      # its target untouched (the inheritance Windows propagates must not
      # follow it), an ACE that is not the whole grant is no grant, and a
      # failure of the grant is raised with the function's own message, the
      # ACL left as it was.
      # Value: protects=one grant, inherited by existing files and never re-applied, and no grant through a junction at or below the path down to Root; fails_when=the link check goes, or the existing-grant check stops returning $false; why_new=only the static pytest sees the call site; seam=none; no_claim=symbolic links (same attribute bit, not exercised)
      # Value: protects=a hard link to a file put where a directory is expected is refused and its target keeps its ACL; fails_when=the check tests only the link attribute, not that it is a directory; why_new=a hard link carries no reparse bit; seam=none; no_claim=a hard link swapped in after the check, which the open handles rule out
      # Value: protects=the open handles' share mode applies, so a directory in the chain cannot be renamed or replaced between the check and the write; fails_when=the handles hold no data right (Windows then ignores their share mode) or share deleting; why_new=only a handle held open for deleting shows it; seam=none; no_claim=a rename attempted while the grant runs, which needs a hook between two calls
      # Value: protects=a junction that already reaches the account's grant is left as it is, not refused; fails_when=the link check runs before the existing-grant check; why_new=a logs dir an operator moved behind a junction, granted by icacls /T, was refused on every upgrade; seam=none; no_claim=a junction reaching no grant, which is refused
      # Value: protects=a dangling junction is refused by the handle check, in the account step and the plan alike; fails_when=a failed read of the existing grant escapes as an error (the plan then lets msiexec remove the agent before the step fails); why_new=every other junction case has a live target; seam=none; no_claim=a target that exists but cannot be opened
      # Value: protects=the check stops at Root and never inspects Root itself, even a Root that is a junction or written with a trailing backslash; fails_when=the check starts at Root, or Root's trailing backslash is no longer trimmed; why_new=nothing at or above the step's root is a link, so a check running past Root passed; seam=none; no_claim=a drive-root Root
      # Value: protects=a junction the account plants inside its directory never carries the SYSTEM-applied grant to its target; fails_when=/T comes back, or Windows' propagation follows a junction child; why_new=the step only links the granted dir itself or a parent; seam=none; no_claim=hard links inside, which share their target's ACL
      # Value: protects=a read-only, container-only, object-only or inherit-only ACE is no grant: the full one lands, on the dir, new files and new subdirs; fails_when=the existing-grant check drops its rights test, either inheritance half or its IO test; why_new=only a real full grant is re-checked; seam=none; no_claim=deny ACEs
      # Value: protects=a failure of the grant (an unparseable SID) fails the account step (the install's 1603) with the function's message, the ACL unchanged; fails_when=the failure is swallowed and reported as a grant, or the message loses the path; why_new=nothing else makes the grant fail; seam=none; no_claim=which Win32 errors the handle calls raise
      - name: Verify the agent directory grant
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          foreach ($fn in 'Initialize-AgentDirectoryType', 'Test-AgentDirectoryGrant', 'Format-AgentDirectoryRefusal', 'Grant-AgentDirectory') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }
          $sid = "S-1-5-19"  # LOCAL SERVICE: any principal the test can grant
          function Get-GrantCount($Path) {
            return @((Get-Acl -LiteralPath $Path).GetAccessRules($true, $false, [System.Security.Principal.SecurityIdentifier]) |
              Where-Object { $_.IdentityReference.Value -eq $sid }).Count
          }
          # The message of the refusal Grant-AgentDirectory throws for Path,
          # or $null when it did not throw; any other error fails the step.
          function Get-Refusal($Path, $Root) {
            try { Grant-AgentDirectory -Path $Path -Sid $sid -Root $Root | Out-Null } catch {
              if ($_.Exception.Message -match "so the installer will not grant the service account access through it") { return $_.Exception.Message }
              throw
            }
            return $null
          }

          $root = Join-Path $env:RUNNER_TEMP ("fn-grant-" + [guid]::NewGuid())
          $agent = Join-Path $root "fivenines_agent"
          $logs = Join-Path $agent "logs"
          $target = Join-Path $root "elsewhere"
          New-Item -ItemType Directory -Path $logs, $target | Out-Null
          Set-Content -LiteralPath (Join-Path $logs "agent.log") -Value "x"

          if (-not (Grant-AgentDirectory -Path $agent -Sid $sid -Root $root)) { throw "the first grant reported an existing one" }
          if ((Get-GrantCount $agent) -ne 1) { throw "the grant did not land" }
          $inherited = @((Get-Acl -LiteralPath (Join-Path $logs "agent.log")).GetAccessRules($false, $true, [System.Security.Principal.SecurityIdentifier]) |
            Where-Object { $_.IdentityReference.Value -eq $sid }).Count
          if ($inherited -lt 1) { throw "an existing file did not inherit the grant" }
          if (Grant-AgentDirectory -Path $agent -Sid $sid -Root $root) { throw "a second grant was applied again" }
          Write-Host "Granted once, inherited by an existing file, then left alone."

          Remove-Item -LiteralPath $logs -Recurse -Force
          cmd /c mklink /J "$logs" "$target" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
          $refusal = Get-Refusal $logs $root
          if ($refusal -notmatch ("^" + [regex]::Escape($logs) + " is a junction or a symbolic link")) { throw "a junction was not refused: $refusal" }
          Write-Host "Refused: $refusal"
          if ((Get-GrantCount $target) -ne 0) { throw "the junction's target was granted" }

          $real = Join-Path $root "real"
          New-Item -ItemType Directory -Path (Join-Path $real "logs") | Out-Null
          $link = Join-Path $root "link"
          cmd /c mklink /J "$link" "$real" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
          $refusal = Get-Refusal (Join-Path $link "logs") $root
          if ($refusal -notmatch ("^" + [regex]::Escape($link) + " is a junction or a symbolic link")) { throw "a directory under a junction was not refused: $refusal" }
          if ((Get-GrantCount (Join-Path $real "logs")) -ne 0) { throw "the directory under the junction was granted" }
          Write-Host "Refused a junction and a directory under one, their targets untouched."
          cmd /c rmdir "$logs" "$link" | Out-Null

          # A hard link to a file where a directory is expected: no link
          # attribute, so only the directory check refuses it, and the file
          # it shares its ACL with keeps that ACL.
          $plain = Join-Path $root "plain.txt"
          Set-Content -LiteralPath $plain -Value "x"
          $hardLink = Join-Path $agent "hard-linked"
          cmd /c mklink /H "$hardLink" "$plain" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /H failed" }
          $sddl = (Get-Acl -LiteralPath $plain).Sddl
          $refusal = Get-Refusal $hardLink $root
          if ($refusal -notmatch ("^" + [regex]::Escape($hardLink) + " is not a directory")) { throw "a hard link to a file was not refused: $refusal" }
          if ((Get-Acl -LiteralPath $plain).Sddl -ne $sddl) { throw "the grant reached the file a hard link shares its ACL with" }
          Remove-Item -LiteralPath $hardLink -Force
          Write-Host "Refused a hard link to a file, the file's ACL untouched."

          # The handles pin the directories only because they hold a data
          # right (listing): Windows applies their share mode, which refuses
          # any other handle that could rename or delete them, and applies it
          # both ways, so a directory already open for deleting is not
          # granted (a sharing violation, error 32) and keeps its ACL.
          Add-Type -TypeDefinition @"
            using System;
            using System.Runtime.InteropServices;
            using Microsoft.Win32.SafeHandles;
            public static class FnCiHandle {
                [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]
                public static extern SafeFileHandle CreateFileW(string name, uint access, uint share, IntPtr security, uint disposition, uint flags, IntPtr template);
            }
          "@
          $held = Join-Path $root "held"
          New-Item -ItemType Directory -Path $held | Out-Null
          # DELETE, shared for everything, as a rename holds it; directories
          # open only with FILE_FLAG_BACKUP_SEMANTICS.
          $deleting = [FnCiHandle]::CreateFileW($held, 0x10000, 7, [IntPtr]::Zero, 3, 0x02000000, [IntPtr]::Zero)
          if ($deleting.IsInvalid) { throw "could not open $held for deleting" }
          $raised = $null
          try { Grant-AgentDirectory -Path $held -Sid $sid -Root $root | Out-Null } catch { $raised = $_.Exception.Message } finally { $deleting.Dispose() }
          if ($raised -notmatch "\(error 32\)") { throw "a directory open for deleting was granted, or failed otherwise: $raised" }
          if ((Get-GrantCount $held) -ne 0) { throw "the directory open for deleting was granted" }
          Write-Host "A directory open for deleting is not granted: $raised"

          # A junction that already reaches the grant (a directory an
          # operator moved behind a junction, which icacls /T granted) is
          # left as it is: nothing would be written through it.
          $grantedReal = Join-Path $root "granted-real"
          $grantedLink = Join-Path $root "granted-link"
          New-Item -ItemType Directory -Path $grantedReal | Out-Null
          if (-not (Grant-AgentDirectory -Path $grantedReal -Sid $sid -Root $root)) { throw "the grant on a plain directory reported an existing one" }
          cmd /c mklink /J "$grantedLink" "$grantedReal" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
          $again = $null
          try { $again = Grant-AgentDirectory -Path $grantedLink -Sid $sid -Root $root } catch { throw "a junction reaching the grant was refused: $_" }
          if ($again) { throw "a junction reaching the grant was granted again" }
          cmd /c rmdir "$grantedLink" | Out-Null
          Write-Host "A junction that already reaches the grant is left as it is."

          # A junction whose target is gone: reading its grant fails, which
          # is no grant, and the handle check refuses the junction itself
          # (not an unnamed error).
          $goneTarget = Join-Path $root "gone-target"
          $dangling = Join-Path $root "dangling"
          New-Item -ItemType Directory -Path $goneTarget | Out-Null
          cmd /c mklink /J "$dangling" "$goneTarget" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
          Remove-Item -LiteralPath $goneTarget -Force
          $refusal = Get-Refusal $dangling $root
          if ($refusal -notmatch ("^" + [regex]::Escape($dangling) + " is a junction or a symbolic link")) { throw "a dangling junction was not refused: $refusal" }
          cmd /c rmdir "$dangling" | Out-Null
          Write-Host "A dangling junction is refused."

          # The check stops at Root without looking at Root itself: a plain
          # directory under a Root that is a junction is granted (on the
          # junction's target, which the path reaches), and so is it with Root
          # written with a trailing backslash. A check starting at Root, or
          # comparing it untrimmed, reaches the junction and refuses.
          $rootReal = Join-Path $root "root-real"
          $rootLink = Join-Path $root "root-link"
          New-Item -ItemType Directory -Path (Join-Path $rootReal "child") | Out-Null
          cmd /c mklink /J "$rootLink" "$rootReal" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
          $child = Join-Path $rootLink "child"
          $granted = $null
          try { $granted = Grant-AgentDirectory -Path $child -Sid $sid -Root $rootLink } catch { throw "the check went past a Root that is a junction: $_" }
          if (-not $granted) { throw "the grant under a junction Root reported an existing one" }
          if ((Get-GrantCount (Join-Path $rootReal "child")) -ne 1) { throw "the grant under a junction Root did not land" }
          $again = $null
          try { $again = Grant-AgentDirectory -Path $child -Sid $sid -Root ($rootLink + "\") } catch { throw "the check went past a Root written with a trailing backslash: $_" }
          if ($again) { throw "the grant under a Root written with a trailing backslash was applied again" }
          cmd /c rmdir "$rootLink" | Out-Null
          Write-Host "The check stops at Root, a junction itself, with or without a trailing backslash."

          # A junction inside the granted directory, as the account could
          # plant one: the grant lands on the directory, and the junction's
          # target (a directory and a file in it) keeps its ACL as it was.
          $fresh = Join-Path $root "fresh"
          $victim = Join-Path $root "victim"
          $victimFile = Join-Path $victim "file.txt"
          $planted = Join-Path $fresh "planted"
          New-Item -ItemType Directory -Path $fresh, $victim | Out-Null
          Set-Content -LiteralPath $victimFile -Value "x"
          cmd /c mklink /J "$planted" "$victim" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
          $before = @{}
          foreach ($p in @($victim, $victimFile)) { $before[$p] = (Get-Acl -LiteralPath $p).Sddl }
          if (-not (Grant-AgentDirectory -Path $fresh -Sid $sid -Root $root)) { throw "the grant over a planted junction reported an existing one" }
          if ((Get-GrantCount $fresh) -ne 1) { throw "the grant did not land on a directory holding a junction" }
          foreach ($p in @($victim, $victimFile)) {
            if ((Get-Acl -LiteralPath $p).Sddl -ne $before[$p]) { throw "the grant reached $p through a junction inside the granted directory" }
          }
          cmd /c rmdir "$planted" | Out-Null
          Write-Host "A junction inside a granted directory: its target untouched."

          # An ACE that is not the whole grant is no grant: the full one lands
          # over it, on the directory and on a file and a subdirectory created
          # in it afterwards (an object-only ACE already reaches the file and
          # the directory itself, so only the subdirectory tells it apart).
          function Test-FullControl($Path, [bool]$Inherited) {
            return @((Get-Acl -LiteralPath $Path).GetAccessRules((-not $Inherited), $Inherited, [System.Security.Principal.SecurityIdentifier]) |
              Where-Object { $_.IdentityReference.Value -eq $sid -and "$($_.AccessControlType)" -eq "Allow" -and
                (([int]$_.FileSystemRights -band 0x1F01FF) -eq 0x1F01FF) -and (([int]$_.PropagationFlags -band 2) -eq 0) }).Count -gt 0
          }
          foreach ($partial in @("(OI)(CI)R", "(CI)F", "(OI)F", "(OI)(CI)(IO)F")) {
            $dir = Join-Path $root ("partial-" + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $dir | Out-Null
            $out = & icacls.exe $dir /grant "*$($sid):$partial" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "icacls $partial failed: $out" }
            if (-not (Grant-AgentDirectory -Path $dir -Sid $sid -Root $root)) { throw "an existing $partial ACE was taken for the grant" }
            $probe = Join-Path $dir "probe.txt"
            $probeDir = Join-Path $dir "probe-dir"
            Set-Content -LiteralPath $probe -Value "x"
            New-Item -ItemType Directory -Path $probeDir | Out-Null
            if (-not (Test-FullControl $dir $false) -or -not (Test-FullControl $probe $true) -or -not (Test-FullControl $probeDir $true)) {
              throw "the grant over an existing $partial ACE did not land on the directory, a new file and a new subdirectory"
            }
          }
          Write-Host "Read-only, container-only, object-only and inherit-only ACEs are no grant: the full one lands over each."

          # A failure of the grant (a SID it cannot parse) is raised with the
          # function's own message, never reported as a grant, and changes
          # nothing.
          $sddl = (Get-Acl -LiteralPath $fresh).Sddl
          $raised = $null
          try { Grant-AgentDirectory -Path $fresh -Sid "S-1-5-21-0-bogus" -Root $root | Out-Null } catch { $raised = $_.Exception.Message }
          if ($null -eq $raised) { throw "a failed grant was reported as a grant" }
          Write-Host "Failed grant raised: $raised"
          if ($raised -notmatch ("^Could not grant the service account access to " + [regex]::Escape($fresh) + ": \S")) {
            throw "the failed grant was not raised with the function's message: $raised"
          }
          if ((Get-Acl -LiteralPath $fresh).Sddl -ne $sddl) { throw "the failed grant changed the ACL of $fresh" }

      # The bootstraps' work directory: under %SystemRoot%\Temp, owned by
      # Administrators, protected from inheritance, writable by SYSTEM and
      # Administrators only, so no other local user can create or rewrite the
      # MSI, its extracted copy or the log in it; recorded with its marker.
      - name: Verify the bootstrap's private work directory
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content fivenines_setup.ps1 -Raw
          foreach ($fn in 'Get-WorkDirectoryKey', 'New-PrivateWorkDirectory') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_setup.ps1" }
            Invoke-Expression $m.Value
          }
          $dir = New-PrivateWorkDirectory "fn-ci"
          $key = Get-WorkDirectoryKey
          try {
            # Recorded with its marker, in the directory and in the key.
            $marker = ([string](Get-Item -LiteralPath $key).GetValue((Split-Path -Leaf $dir))).Split('|')[0]
            if (-not $marker -or (Get-Content -LiteralPath (Join-Path $dir ".fivenines-work-directory") -TotalCount 1) -ne $marker) { throw "$dir is not recorded with its marker" }
            # The marker file: SYSTEM and Administrators only, the running user excluded.
            $markerAcl = Get-Acl -LiteralPath (Join-Path $dir ".fivenines-work-directory")
            $markerSids = @($markerAcl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $markerAcl.AreAccessRulesProtected -or ($markerSids -join ",") -ne "S-1-5-18,S-1-5-32-544" -or $markerAcl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne "S-1-5-32-544") { throw "the marker in $dir is open to: $($markerSids -join ', ')" }
            $acl = Get-Acl -LiteralPath $dir
            if (-not $acl.AreAccessRulesProtected) { throw "$dir inherits its parent's ACL" }
            # Under %SystemRoot%\Temp, owned by Administrators; SYSTEM and
            # Administrators, plus read-only for this runner's user (the user
            # running a bootstrap reads its log unelevated).
            if ((Split-Path -Parent $dir) -ne (Join-Path $env:SystemRoot "Temp")) { throw "$dir is not under %SystemRoot%\Temp" }
            if ($acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne "S-1-5-32-544") { throw "$dir is not owned by Administrators" }
            $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $expected = (@("S-1-5-18", "S-1-5-32-544", $me) | Sort-Object -Unique) -join ","
            $readOnly = [int][System.Security.AccessControl.FileSystemRights]::ReadAndExecute -bor [int][System.Security.AccessControl.FileSystemRights]::Synchronize
            $rules = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]))
            $sids = @($rules | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (($sids -join ",") -ne $expected) { throw "$dir is open to: $($sids -join ', ')" }
            if (@($rules | Where-Object { $_.IsInherited -or $_.AccessControlType -ne 'Allow' }).Count -ne 0) { throw "$dir has an inherited or deny rule" }
            if (@($rules | Where-Object { $_.IdentityReference.Value -eq $me -and ([int]$_.FileSystemRights -band -bnot $readOnly) -ne 0 }).Count -ne 0) { throw "the running user has more than read access to $dir" }
            Set-Content -LiteralPath (Join-Path $dir "probe.txt") -Value "x"
            $file = @((Get-Acl -LiteralPath (Join-Path $dir "probe.txt")).GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) |
              ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (($file -join ",") -ne $expected) { throw "a file in $dir is open to: $($file -join ', ')" }
            Write-Host "$dir and what is created in it: SYSTEM and Administrators, and the running user read-only."
          } finally {
            Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -LiteralPath $key -Name (Split-Path -Leaf $dir) -ErrorAction SilentlyContinue
          }

      # The same under PowerShell 7, whose .NET has no
      # Directory.CreateDirectory overload taking an ACL: the bootstraps are
      # also run from pwsh.
      - name: Verify the bootstrap's private work directory (PowerShell 7)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content fivenines_setup.ps1 -Raw
          foreach ($fn in 'Get-WorkDirectoryKey', 'New-PrivateWorkDirectory') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_setup.ps1" }
            Invoke-Expression $m.Value
          }
          $dir = New-PrivateWorkDirectory "fn-ci"
          $key = Get-WorkDirectoryKey
          try {
            # Recorded with its marker, in the directory and in the key.
            $marker = ([string](Get-Item -LiteralPath $key).GetValue((Split-Path -Leaf $dir))).Split('|')[0]
            if (-not $marker -or (Get-Content -LiteralPath (Join-Path $dir ".fivenines-work-directory") -TotalCount 1) -ne $marker) { throw "$dir is not recorded with its marker" }
            # The marker file: SYSTEM and Administrators only, the running user excluded.
            $markerAcl = Get-Acl -LiteralPath (Join-Path $dir ".fivenines-work-directory")
            $markerSids = @($markerAcl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $markerAcl.AreAccessRulesProtected -or ($markerSids -join ",") -ne "S-1-5-18,S-1-5-32-544" -or $markerAcl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne "S-1-5-32-544") { throw "the marker in $dir is open to: $($markerSids -join ', ')" }
            $acl = Get-Acl -LiteralPath $dir
            if (-not $acl.AreAccessRulesProtected) { throw "$dir inherits its parent's ACL" }
            # Under %SystemRoot%\Temp, owned by Administrators; SYSTEM and
            # Administrators, plus read-only for this runner's user (the user
            # running a bootstrap reads its log unelevated).
            if ((Split-Path -Parent $dir) -ne (Join-Path $env:SystemRoot "Temp")) { throw "$dir is not under %SystemRoot%\Temp" }
            if ($acl.GetOwner([System.Security.Principal.SecurityIdentifier]).Value -ne "S-1-5-32-544") { throw "$dir is not owned by Administrators" }
            $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
            $expected = (@("S-1-5-18", "S-1-5-32-544", $me) | Sort-Object -Unique) -join ","
            $readOnly = [int][System.Security.AccessControl.FileSystemRights]::ReadAndExecute -bor [int][System.Security.AccessControl.FileSystemRights]::Synchronize
            $rules = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]))
            $sids = @($rules | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (($sids -join ",") -ne $expected) { throw "$dir is open to: $($sids -join ', ')" }
            if (@($rules | Where-Object { $_.IsInherited -or $_.AccessControlType -ne 'Allow' }).Count -ne 0) { throw "$dir has an inherited or deny rule" }
            if (@($rules | Where-Object { $_.IdentityReference.Value -eq $me -and ([int]$_.FileSystemRights -band -bnot $readOnly) -ne 0 }).Count -ne 0) { throw "the running user has more than read access to $dir" }
            Set-Content -LiteralPath (Join-Path $dir "probe.txt") -Value "x"
            $file = @((Get-Acl -LiteralPath (Join-Path $dir "probe.txt")).GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) |
              ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (($file -join ",") -ne $expected) { throw "a file in $dir is open to: $($file -join ', ')" }
            Write-Host "$dir and what is created in it: SYSTEM and Administrators, and the running user read-only."
          } finally {
            Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -LiteralPath $key -Name (Split-Path -Leaf $dir) -ErrorAction SilentlyContinue
          }

      # What a run removes: the work directories earlier runs recorded, and
      # only while each is a plain directory owned by Administrators that
      # holds its recorded marker. An earlier run's directory goes, with its
      # record, once older than the age floor; one a file in use keeps stays
      # with its marker and record, and goes once the file is closed; one a
      # run still alive recorded stays, record included, until that run
      # ends, and so does its record of a directory not created yet. Kept:
      # this run's; one that passes every check but was never recorded; and
      # what stands at a recorded path once its directory is gone (a plain
      # directory holding a forged marker, one owned by another account, a
      # junction to another of these directories), whose record goes. A
      # record whose directory is gone goes too.
      - name: Verify the pruning of earlier work directories
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content fivenines_setup.ps1 -Raw
          foreach ($fn in 'Get-WorkDirectoryKey', 'New-PrivateWorkDirectory', 'Remove-WorkDirectory', 'Remove-EarlierWorkDirectories') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_setup.ps1" }
            Invoke-Expression $m.Value
          }
          $key = Get-WorkDirectoryKey
          function Test-Recorded([string]$Path) { return $null -ne (Get-Item -LiteralPath $key).GetValue((Split-Path -Leaf $Path)) }
          $current = New-PrivateWorkDirectory "fivenines-update"
          $earlier = New-PrivateWorkDirectory "fivenines-setup"
          Set-Content -LiteralPath (Join-Path $earlier "fivenines-agent-windows-amd64.msi") -Value "x"
          $unrecorded = New-PrivateWorkDirectory "fivenines-setup"
          Remove-ItemProperty -LiteralPath $key -Name (Split-Path -Leaf $unrecorded)
          $forged = New-PrivateWorkDirectory "fivenines-setup"
          Remove-Item -LiteralPath $forged -Recurse -Force
          New-Item -ItemType Directory -Path $forged | Out-Null
          Set-Content -LiteralPath (Join-Path $forged ".fivenines-work-directory") -Value ([guid]::NewGuid().ToString())
          $target = New-PrivateWorkDirectory "fn-prune-target"
          Set-Content -LiteralPath (Join-Path $target "keep.txt") -Value "x"
          $linked = New-PrivateWorkDirectory "fivenines-update"
          Remove-Item -LiteralPath $linked -Recurse -Force
          cmd /c mklink /J "$linked" "$target" | Out-Null
          if (-not (Test-Path -LiteralPath $linked)) { throw "mklink /J failed" }
          $gone = New-PrivateWorkDirectory "fivenines-uninstall"
          Remove-Item -LiteralPath $gone -Recurse -Force
          $owned = New-PrivateWorkDirectory "fivenines-setup"
          $ownedAcl = Get-Acl -LiteralPath $owned
          $ownedAcl.SetOwner([System.Security.Principal.WindowsIdentity]::GetCurrent().User)
          Set-Acl -LiteralPath $owned -AclObject $ownedAcl
          $busy = New-PrivateWorkDirectory "fivenines-update"
          $busyFile = Join-Path $busy "fivenines-update.log"
          Set-Content -LiteralPath $busyFile -Value "x"
          $held = $null
          # A run still alive (another process): its directory and its record
          # stay whatever their age, and so does the record of a directory it
          # has not created yet.
          $sleeper = Start-Process powershell -ArgumentList '-NoProfile', '-Command', 'Start-Sleep -Seconds 900' -PassThru -WindowStyle Hidden
          $sleeperRun = "{0}|{1}" -f $sleeper.Id, (Get-Process -Id $sleeper.Id).StartTime.ToFileTimeUtc()
          $live = New-PrivateWorkDirectory "fivenines-update"
          $liveMarker = ([string](Get-Item -LiteralPath $key).GetValue((Split-Path -Leaf $live))).Split('|')[0]
          Set-ItemProperty -LiteralPath $key -Name (Split-Path -Leaf $live) -Value "$liveMarker|$sleeperRun"
          $pending = "fivenines-setup-" + [guid]::NewGuid()
          New-ItemProperty -LiteralPath $key -Name $pending -Value "$([guid]::NewGuid())|$sleeperRun" -PropertyType String | Out-Null
          try {
            Remove-EarlierWorkDirectories -Keep $current
            if (-not (Test-Path -LiteralPath $earlier) -or -not (Test-Recorded $earlier)) { throw "a directory younger than the age floor was removed" }
            $held = [System.IO.File]::Open($busyFile, 'Open', 'Read', 'Read')
            Remove-EarlierWorkDirectories -Keep $current -MinAgeMinutes 0
            if ((Test-Path -LiteralPath $earlier) -or (Test-Recorded $earlier)) { throw "an earlier run's directory or its record was kept" }
            if (-not (Test-Path -LiteralPath $current) -or -not (Test-Recorded $current)) { throw "this run's directory or its record was removed" }
            if (-not (Test-Path -LiteralPath $unrecorded)) { throw "a directory never recorded was removed" }
            if (-not (Test-Path -LiteralPath $forged)) { throw "a directory holding a forged marker was removed" }
            if (Test-Recorded $forged) { throw "the record of a replaced directory was kept" }
            if (-not (Test-Path -LiteralPath $linked)) { throw "a junction was removed" }
            if (-not (Test-Path -LiteralPath (Join-Path $target "keep.txt"))) { throw "the junction's target was touched" }
            if (Test-Recorded $linked) { throw "the record of a directory replaced by a junction was kept" }
            if (Test-Recorded $gone) { throw "the record of a directory gone was kept" }
            if (-not (Test-Path -LiteralPath $owned)) { throw "a directory owned by another account was removed" }
            if (Test-Recorded $owned) { throw "the record of a directory owned by another account was kept" }
            if (-not (Test-Path -LiteralPath (Join-Path $busy ".fivenines-work-directory")) -or -not (Test-Recorded $busy)) { throw "a directory a file in use kept lost its marker or its record" }
            if (-not (Test-Path -LiteralPath $live) -or -not (Test-Recorded $live)) { throw "a live run's directory or its record was removed" }
            if ($null -eq (Get-Item -LiteralPath $key).GetValue($pending)) { throw "a live run's record of a directory not created yet was dropped" }
            $held.Dispose(); $held = $null
            Stop-Process -Id $sleeper.Id -Force; $sleeper.WaitForExit()
            Remove-EarlierWorkDirectories -Keep $current -MinAgeMinutes 0
            if ((Test-Path -LiteralPath $busy) -or (Test-Recorded $busy)) { throw "a directory a file in use kept was not removed once the file was closed" }
            if ((Test-Path -LiteralPath $live) -or (Test-Recorded $live)) { throw "a finished run's directory or its record was kept" }
            if ($null -ne (Get-Item -LiteralPath $key).GetValue($pending)) { throw "a finished run's record of nothing was kept" }
            $acl = Get-Acl -Path $key
            $granted = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $acl.AreAccessRulesProtected -or ($granted -join ",") -ne "S-1-5-18,S-1-5-32-544") { throw "$key is open to: $($granted -join ', ')" }
            Write-Host "Removed an earlier run's directory, one a file in use kept once the file was closed, and a live run's once it ended; dropped the records of four replaced or gone; kept this run's, a newer one, one never recorded, a forged one, one owned by another account and a junction with its target. The key is open to SYSTEM and Administrators only."
          } finally {
            if ($held) { $held.Dispose() }
            Stop-Process -Id $sleeper.Id -Force -ErrorAction SilentlyContinue
            Remove-ItemProperty -LiteralPath $key -Name $pending -ErrorAction SilentlyContinue
            cmd /c rmdir "$linked" | Out-Null
            foreach ($d in @($current, $earlier, $unrecorded, $forged, $target, $linked, $gone, $owned, $busy, $live)) {
              Remove-Item -LiteralPath $d -Recurse -Force -ErrorAction SilentlyContinue
              Remove-ItemProperty -LiteralPath $key -Name (Split-Path -Leaf $d) -ErrorAction SilentlyContinue
            }
          }

      # The installed product's recorded install source (the MSI a repair
      # reads) survives the pruning, matched whatever its case and with the
      # trailing backslash Windows Installer writes. And the record key's ACL
      # is reset when it is not exactly SYSTEM and Administrators, so no
      # local user can read a marker and forge one.
      # Value: protects=the installed product's recorded install source survives the pruning; fails_when=the InstallSource keep is dropped or compares paths wrongly (trailing backslash, case); why_new=no CI case seeds an Uninstall entry; seam=none; no_claim=a real msiexec repair
      # Value: protects=the markers stay unreadable to local users, so none can forge one; fails_when=the repair branch of Get-WorkDirectoryKey stops resetting an ACL that is not exactly SYSTEM and Administrators; why_new=CI only ever sees a fresh or already-correct key; seam=none; no_claim=that the window between key creation and the ACL reset is closed
      - name: Verify the install source is kept and the record key's ACL repaired
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content fivenines_setup.ps1 -Raw
          foreach ($fn in 'Get-WorkDirectoryKey', 'New-PrivateWorkDirectory', 'Remove-WorkDirectory', 'Remove-EarlierWorkDirectories') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_setup.ps1" }
            Invoke-Expression $m.Value
          }
          $key = Get-WorkDirectoryKey
          $uninstall = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"
          if (@(Get-ItemProperty "$uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match "Fivenines Monitoring Agent" }).Count -ne 0) {
            throw "a Fivenines Monitoring Agent product is already registered on this runner; this step needs none"
          }
          $source = New-PrivateWorkDirectory "fivenines-setup"
          $current = New-PrivateWorkDirectory "fivenines-update"
          $entry = Join-Path $uninstall ("{" + [guid]::NewGuid().ToString().ToUpper() + "}")
          try {
            New-Item -Path $entry -Force | Out-Null
            New-ItemProperty -LiteralPath $entry -Name DisplayName -Value "Fivenines Monitoring Agent" -PropertyType String | Out-Null
            New-ItemProperty -LiteralPath $entry -Name InstallSource -Value ($source.ToUpper() + "\") -PropertyType String | Out-Null
            Remove-EarlierWorkDirectories -Keep $current -MinAgeMinutes 0
            if (-not (Test-Path -LiteralPath $source)) { throw "the installed product's install source was removed" }
            if ($null -eq (Get-Item -LiteralPath $key).GetValue((Split-Path -Leaf $source))) { throw "the install source's record was removed" }

            # Open the key to BUILTIN\Users, then let Get-WorkDirectoryKey repair it.
            $acl = Get-Acl -Path $key
            $acl.AddAccessRule((New-Object System.Security.AccessControl.RegistryAccessRule(
              (New-Object System.Security.Principal.SecurityIdentifier("S-1-5-32-545")),
              [System.Security.AccessControl.RegistryRights]::ReadKey,
              [System.Security.AccessControl.InheritanceFlags]::ContainerInherit,
              [System.Security.AccessControl.PropagationFlags]::None,
              [System.Security.AccessControl.AccessControlType]::Allow)))
            Set-Acl -Path $key -AclObject $acl
            $opened = @((Get-Acl -Path $key).GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object { $_.IdentityReference.Value })
            if ($opened -notcontains "S-1-5-32-545") { throw "could not open $key to BUILTIN\Users for the test" }
            Get-WorkDirectoryKey | Out-Null
            $acl = Get-Acl -Path $key
            $granted = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) | ForEach-Object { $_.IdentityReference.Value } | Sort-Object -Unique)
            if (-not $acl.AreAccessRulesProtected -or ($granted -join ",") -ne "S-1-5-18,S-1-5-32-544") { throw "$key was not repaired; open to: $($granted -join ', ')" }
            Write-Host "Kept the install source an Uninstall entry records (upper case, trailing backslash) with its record; reset a key opened to BUILTIN\Users to SYSTEM and Administrators."
          } finally {
            Remove-Item -LiteralPath $entry -Recurse -Force -ErrorAction SilentlyContinue
            foreach ($d in @($source, $current)) {
              Remove-Item -LiteralPath $d -Recurse -Force -ErrorAction SilentlyContinue
              Remove-ItemProperty -LiteralPath $key -Name (Split-Path -Leaf $d) -ErrorAction SilentlyContinue
            }
          }

      # What a successful uninstall leaves: no work directory these scripts
      # recorded, whatever its age, except one a file in use keeps and one a
      # run still alive recorded (each with its record, so the key stays); no
      # fivenines-bootstrap key once it
      # records nothing; and no Five-Nines.io key once it is empty -- never
      # a vendor key that still holds something.
      # Value: protects=a successful uninstall leaves no work directory, no fivenines-bootstrap key and no empty Five-Nines.io key, and never removes a vendor key that still holds something; fails_when=the record, key or vendor cleanup regresses, or a non-empty vendor key is removed; why_new=only a static check covers it; seam=none; no_claim=msiexec /x itself
      - name: Verify the uninstall removes its work directory and empty keys
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content fivenines_setup.ps1 -Raw
          foreach ($fn in 'Get-WorkDirectoryKey', 'New-PrivateWorkDirectory', 'Remove-WorkDirectory', 'Remove-EarlierWorkDirectories') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_setup.ps1" }
            Invoke-Expression $m.Value
          }
          $m = [regex]::Match((Get-Content fivenines_uninstall.ps1 -Raw), "(?ms)^function Remove-AllWorkDirectories \{.*?^\}")
          if (-not $m.Success) { throw "Remove-AllWorkDirectories not found in fivenines_uninstall.ps1" }
          Invoke-Expression $m.Value
          $vendor = "HKLM:\SOFTWARE\Five-Nines.io"
          $bootstrap = "$vendor\fivenines-bootstrap"
          $sibling = "$vendor\fn-ci-sibling"
          # Content in the vendor key this step did not create (other than the
          # bootstrap key earlier steps use) means scenario (b) cannot expect it gone.
          $foreign = $false
          $v = Get-Item -LiteralPath $vendor -ErrorAction SilentlyContinue
          if ($v) {
            $foreign = ($v.ValueCount -ne 0) -or (@($v.GetSubKeyNames() | Where-Object { $_ -ne "fivenines-bootstrap" -and $_ -ne "fn-ci-sibling" }).Count -ne 0)
          }
          function Test-Recorded([string]$Path) { return (Test-Path -LiteralPath $bootstrap) -and $null -ne (Get-Item -LiteralPath $bootstrap).GetValue((Split-Path -Leaf $Path)) }
          $createdSibling = $false
          $held = $null
          $sleeper = $null
          $dirs = @()
          try {
            if (-not (Test-Path -LiteralPath $sibling)) { New-Item -Path $sibling -Force | Out-Null; $createdSibling = $true }

            # (a) A recent setup's directory goes whatever its age; one a file
            # in use keeps stays with its record, so the bootstrap key stays,
            # and the vendor key, which also holds another subkey, stays.
            $WorkDir = New-PrivateWorkDirectory "fivenines-uninstall"
            $dirs += $WorkDir
            Set-Content -LiteralPath (Join-Path $WorkDir "fivenines_uninstall.log") -Value "x"
            $young = New-PrivateWorkDirectory "fivenines-setup"
            $dirs += $young
            Set-Content -LiteralPath (Join-Path $young "fivenines-agent-windows-amd64.msi") -Value "x"
            $busy = New-PrivateWorkDirectory "fivenines-update"
            $dirs += $busy
            $busyFile = Join-Path $busy "fivenines-update.log"
            Set-Content -LiteralPath $busyFile -Value "x"
            $held = [System.IO.File]::Open($busyFile, 'Open', 'Read', 'Read')
            # A setup still running (another process) while the uninstall ends:
            # its directory stays, record included, whatever its age.
            $sleeper = Start-Process powershell -ArgumentList '-NoProfile', '-Command', 'Start-Sleep -Seconds 900' -PassThru -WindowStyle Hidden
            $live = New-PrivateWorkDirectory "fivenines-setup"
            $dirs += $live
            $liveMarker = ([string](Get-Item -LiteralPath $bootstrap).GetValue((Split-Path -Leaf $live))).Split('|')[0]
            Set-ItemProperty -LiteralPath $bootstrap -Name (Split-Path -Leaf $live) -Value ("{0}|{1}|{2}" -f $liveMarker, $sleeper.Id, (Get-Process -Id $sleeper.Id).StartTime.ToFileTimeUtc())
            Remove-AllWorkDirectories
            if (Test-Path -LiteralPath $WorkDir) { throw "the uninstall's work directory was kept" }
            if (Test-Recorded $WorkDir) { throw "the uninstall's record was kept" }
            if ((Test-Path -LiteralPath $young) -or (Test-Recorded $young)) { throw "a recent setup's directory or its record was kept" }
            if (-not (Test-Path -LiteralPath $busy) -or -not (Test-Recorded $busy)) { throw "a directory a file in use kept lost its record, or the bootstrap key went" }
            if (-not (Test-Path -LiteralPath $vendor)) { throw "$vendor was removed though it holds another subkey" }
            if (-not (Test-Path -LiteralPath $sibling)) { throw "$sibling was removed" }
            if (-not (Test-Path -LiteralPath $live) -or -not (Test-Recorded $live)) { throw "the uninstall removed the directory or the record of a setup still running" }
            $held.Dispose(); $held = $null
            Stop-Process -Id $sleeper.Id -Force; $sleeper.WaitForExit()

            # (b) No sibling, no file in use: everything goes, the empty
            # bootstrap and vendor keys too.
            if ($createdSibling) { Remove-Item -LiteralPath $sibling -Force; $createdSibling = $false }
            $WorkDir = New-PrivateWorkDirectory "fivenines-uninstall"
            $dirs += $WorkDir
            Set-Content -LiteralPath (Join-Path $WorkDir "fivenines_uninstall.log") -Value "x"
            Remove-AllWorkDirectories
            if (Test-Path -LiteralPath $WorkDir) { throw "the uninstall's work directory was kept" }
            if ((Test-Path -LiteralPath $busy) -or (Test-Recorded $busy)) { throw "the directory a file in use kept was not removed once the file was closed" }
            if ((Test-Path -LiteralPath $live) -or (Test-Recorded $live)) { throw "a finished setup's directory or its record was kept" }
            $left = @()
            if (Test-Path -LiteralPath $bootstrap) { $left = @((Get-Item -LiteralPath $bootstrap).GetValueNames()) }
            if ($left.Count -eq 0 -and (Test-Path -LiteralPath $bootstrap)) { throw "$bootstrap was kept though it records nothing" }
            $checked = "skipped: $vendor holds content this step did not create (records left: $($left -join ', '))"
            if (-not $foreign -and ((Test-Path -LiteralPath $sibling) -or $left.Count -ne 0)) { $foreign = $true }
            if (-not $foreign) {
              if (Test-Path -LiteralPath $vendor) { throw "$vendor was kept though empty" }
              $checked = "the empty $vendor went too"
            }
            Write-Host "Removed the uninstall's work directory, a recent setup's and, once its file was closed or its run ended, one a file in use kept and one a running setup recorded, with their records and the empty bootstrap key; kept $vendor while it held another subkey; vendor key check: $checked."
          } finally {
            if ($held) { $held.Dispose() }
            if ($sleeper) { Stop-Process -Id $sleeper.Id -Force -ErrorAction SilentlyContinue }
            foreach ($d in $dirs) {
              Remove-Item -LiteralPath $d -Recurse -Force -ErrorAction SilentlyContinue
              if (Test-Path -LiteralPath $bootstrap) { Remove-ItemProperty -LiteralPath $bootstrap -Name (Split-Path -Leaf $d) -ErrorAction SilentlyContinue }
            }
            if ($createdSibling) { Remove-Item -LiteralPath $sibling -Force -ErrorAction SilentlyContinue }
          }

      # The bootstraps' msiexec wrapper, against a stand-in msiexec that
      # answers 1618 twice, then 0: the busy answers are retried, a failure is
      # not, and every call carries /norestart and exactly one UI level,
      # /passive or /qn, never one that shows a modal box. Run as SYSTEM in
      # session 0 (a scheduled task, as an RMM tool or Intune runs it), the
      # level is /qn.
      - name: Verify msiexec retries
        shell: powershell
        # A lost retry bound would spin until GitHub's six-hour limit.
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content fivenines_setup.ps1 -Raw
          $m = [regex]::Match($src, "(?ms)^function Invoke-Msiexec \{.*?^\}")
          if (-not $m.Success) { throw "Invoke-Msiexec not found in fivenines_setup.ps1" }
          Invoke-Expression $m.Value
          $dir = Join-Path $env:RUNNER_TEMP ("fn-msiexec-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $dir | Out-Null
          $fake = Join-Path $dir "fake-msiexec.cmd"
          $callsFile = Join-Path $dir "calls.txt"
          # Answers the Nth call with the Nth code of $Codes, the last one after.
          function New-Fake($Codes) {
            $lines = @(
              '@echo off',
              'echo %*>>"%~dp0calls.txt"',
              'for /f %%c in (''find /c /v "" ^< "%~dp0calls.txt"'') do set n=%%c'
            )
            for ($i = 0; $i -lt $Codes.Count - 1; $i++) { $lines += ('if %n%=={0} exit /b {1}' -f ($i + 1), $Codes[$i]) }
            $lines += ('exit /b {0}' -f $Codes[-1])
            Set-Content -LiteralPath $fake -Value $lines -Encoding ascii
            Remove-Item -LiteralPath $callsFile -ErrorAction SilentlyContinue
          }
          function Get-Calls { return @(Get-Content -LiteralPath $callsFile) }

          New-Fake @(1618, 1618, 0)
          $code = Invoke-Msiexec -Arguments @("/i", "x.msi") -FilePath $fake -RetrySeconds 0
          $calls = Get-Calls
          if ($code -ne 0 -or $calls.Count -ne 3) { throw "busy twice then done: exit $code after $($calls.Count) calls, expected 0 after 3" }
          foreach ($call in $calls) {
            if ($call -match "/q[br]") { throw "a UI level that shows modal boxes: $call" }
            $ui = @($call -split " " | Where-Object { $_ -in @("/passive", "/qn") })
            if ($ui.Count -ne 1 -or $call -notmatch "/norestart") { throw "unexpected msiexec arguments: $call" }
          }
          Write-Host "1618 twice, then 0: three calls, each with one UI level ($ui) and /norestart."

          New-Fake @(1601)
          $code = Invoke-Msiexec -Arguments @("/x", "{x}") -FilePath $fake -RetrySeconds 0
          if ($code -ne 1601 -or (Get-Calls).Count -ne 4) { throw "always busy: exit $code after $((Get-Calls).Count) calls, expected 1601 after 4" }
          New-Fake @(1603)
          $code = Invoke-Msiexec -Arguments @("/i", "x.msi") -FilePath $fake -RetrySeconds 0
          if ($code -ne 1603 -or (Get-Calls).Count -ne 1) { throw "a failure was retried: exit $code after $((Get-Calls).Count) calls" }
          New-Fake @(0)
          Invoke-Msiexec -Arguments @("/a", "x.msi") -Quiet -FilePath $fake -RetrySeconds 0 | Out-Null
          # @(...) around the call: a function's one-element array comes back as its element.
          $first = @(Get-Calls)[0]
          if ($first -notmatch "/qn") { throw "-Quiet did not force /qn: $first" }
          Write-Host "Always busy: four calls, then the code. A failure: one call. -Quiet: /qn."

          New-Fake @(0)
          $run = Join-Path $dir "session0.ps1"
          Set-Content -LiteralPath $run -Encoding ascii -Value ($m.Value + "`r`nInvoke-Msiexec -Arguments @('/i', 'x.msi') -FilePath '$fake' -RetrySeconds 0 | Out-Null`r`n")
          $task = "fn-ci-msiexec-session0"
          $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument ('-NoProfile -ExecutionPolicy Bypass -File "{0}"' -f $run)
          Register-ScheduledTask -TaskName $task -Action $action -User "SYSTEM" -RunLevel Highest -Force | Out-Null
          try {
            Start-ScheduledTask -TaskName $task
            $deadline = (Get-Date).AddSeconds(120)
            while (-not (Test-Path -LiteralPath $callsFile)) {
              if ((Get-Date) -gt $deadline) { throw "the SYSTEM task never called msiexec" }
              Start-Sleep -Seconds 1
            }
            $first = @(Get-Calls)[0]
            if ($first -notmatch "/qn" -or $first -notmatch "/norestart") { throw "session 0 did not get /qn /norestart: $first" }
            Write-Host "As SYSTEM in session 0: /qn /norestart."
          } finally {
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath $dir -Recurse -Force

      # Helpers duplicated across scripts that cannot share a file: the
      # custom actions are separate MSI files, the bootstraps are downloaded
      # one by one.
      - name: Verify duplicated installer helpers stay identical
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Get-Fn($path, $fn) {
            $m = [regex]::Match((Get-Content $path -Raw), "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in $path" }
            return $m.Value
          }
          $pairs = @(
            @('Resolve-ServiceAccountSid', 'windows/installer/SetTokenFileAcl.ps1', 'windows/installer/DelegateWmiStorageNamespace.ps1'),
            @('Resolve-ServiceAccountSid', 'windows/installer/SetTokenFileAcl.ps1', 'fivenines_setup.ps1'),
            @('Resolve-ServiceAccountSid', 'windows/installer/SetTokenFileAcl.ps1', 'fivenines_update.ps1'),
            @('ConvertTo-MsiPasswordArgument', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Get-MsiProductCode', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Get-PreflightVerdict', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Invoke-AccountPreflight', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('New-PrivateWorkDirectory', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Invoke-Msiexec', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Invoke-Msiexec', 'fivenines_setup.ps1', 'fivenines_uninstall.ps1'),
            @('New-PrivateWorkDirectory', 'fivenines_setup.ps1', 'fivenines_uninstall.ps1'),
            @('Remove-EarlierWorkDirectories', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Remove-EarlierWorkDirectories', 'fivenines_setup.ps1', 'fivenines_uninstall.ps1'),
            @('Get-WorkDirectoryKey', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Get-WorkDirectoryKey', 'fivenines_setup.ps1', 'fivenines_uninstall.ps1'),
            @('Remove-WorkDirectory', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Remove-WorkDirectory', 'fivenines_setup.ps1', 'fivenines_uninstall.ps1'),
            @('Get-WinNTUser', 'windows/installer/CreateServiceAccount.ps1', 'fivenines_uninstall.ps1'),
            @('Get-WmiNamespaceSD', 'windows/installer/DelegateWmiStorageNamespace.ps1', 'fivenines_uninstall.ps1'),
            @('Set-WmiNamespaceSD', 'windows/installer/DelegateWmiStorageNamespace.ps1', 'fivenines_uninstall.ps1')
          )
          foreach ($p in $pairs) {
            if ((Get-Fn $p[1] $p[0]) -ne (Get-Fn $p[2] $p[0])) { throw "$($p[0]) differs between $($p[1]) and $($p[2])" }
            Write-Host "$($p[0]): identical in $($p[1]) and $($p[2])"
          }

          # A password the MSI's quoted custom-action command line would split.
          Invoke-Expression (Get-Fn 'fivenines_setup.ps1' 'ConvertTo-MsiPasswordArgument')
          $empty = New-Object System.Security.SecureString
          $bad = @($empty, (ConvertTo-SecureString 'pa"ss' -AsPlainText -Force), (ConvertTo-SecureString 'pass\' -AsPlainText -Force),
                   (ConvertTo-SecureString '-pass' -AsPlainText -Force))
          foreach ($b in $bad) {
            $refused = $false
            try { ConvertTo-MsiPasswordArgument $b | Out-Null } catch { $refused = $true }
            if (-not $refused) { throw "a password that splits the custom action's command line was not refused" }
          }
          $arg = ConvertTo-MsiPasswordArgument (ConvertTo-SecureString 'p a$s\w;rd' -AsPlainText -Force)
          if ($arg -ne 'SERVICEACCOUNTPASSWORD="p a$s\w;rd"') { throw "unexpected msiexec argument: $arg" }
          Write-Host "ConvertTo-MsiPasswordArgument refuses '', a quote, a trailing backslash and a leading '-'."

      # The bootstraps' verdict on the plan the MSI's account step prints,
      # case by case under Windows PowerShell 5.1 (Get-PreflightVerdict is
      # pure): on the version already installed the password is applied in
      # place only to the account the service already runs as, and a
      # password LogonUser could not answer for is used with a warning.
      - name: Verify the bootstrap preflight's verdicts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $m = [regex]::Match((Get-Content fivenines_setup.ps1 -Raw), "(?ms)^function Get-PreflightVerdict \{.*?^\}")
          if (-not $m.Success) { throw "Get-PreflightVerdict not found in fivenines_setup.ps1" }
          Invoke-Expression $m.Value

          $accountSid = "S-1-5-21-1-2-3-1001"
          $svc = "HOST\fivenines-agent"
          $reinstall = "fivenines_uninstall.ps1 -KeepAccount, then fivenines_setup.ps1 -Token <token> -ServiceAccountPassword <password>"
          # A plan line as CreateServiceAccount.ps1 -PlanOnly prints it, and
          # as v1.22.1's printed it (no sid, no checked).
          function New-Plan($Action, $Sid = $accountSid, $Checked = $true, $Message = $null) {
            return [pscustomobject]@{ action = $Action; message = $Message; sid = $Sid; checked = $Checked }
          }
          $older = [pscustomobject]@{ action = "UseProvided"; message = $null }

          $script:failed = 0
          function Check($Label, $Plan, $HasPassword, $Installed, $ServiceAccount, $ServiceSid, $Action, [string[]]$Mentions = @()) {
            $v = Get-PreflightVerdict -Plan $Plan -HasPassword $HasPassword -Installed $Installed `
              -AccountName "fivenines-agent" -ServiceAccount $ServiceAccount -ServiceSid $ServiceSid
            $problem = $null
            if ($v.Action -ne $Action) {
              $problem = "$($v.Action), expected $Action"
            } elseif (-not $Mentions -and $v.Message) {
              $problem = "unexpected message"
            } else {
              foreach ($want in $Mentions) {
                if (-not "$($v.Message)".Contains($want)) { $problem = "the message does not mention '$want'" }
              }
            }
            if ($problem) { Write-Host "FAIL $Label -> $problem ($($v.Message))"; $script:failed++ }
            else { Write-Host "ok   $Label -> $Action" }
          }

          # The MSI's own refusal stops everything.
          Check "MSI refuses"              (New-Plan "Refuse" $accountSid $true "wrong password") $true "same" $svc $accountSid "Refuse" @("Nothing was changed: wrong password")
          Check "MSI refuses, upgrade"     (New-Plan "Refuse" $accountSid $true "wrong password") $true "other" "" "" "Refuse" @("Nothing was changed: wrong password")
          Check "MSI refuses, no password" (New-Plan "Refuse" $accountSid $false "needs a password") $false "none" "" "" "Refuse" @("Nothing was changed: needs a password")

          # msiexec runs: a fresh install or an upgrade.
          Check "create, no password"      (New-Plan "Create" $null $false) $false "none" "" "" "Install"
          Check "rotate, no password"      (New-Plan "Rotate" $accountSid $false) $false "none" "" "" "Install"
          Check "checked, upgrade"         (New-Plan "UseProvided") $true "other" "" "" "Install"
          Check "create, upgrade"          (New-Plan "Create" $null $false) $true "other" "" "" "Install"

          # A password LogonUser could not answer for (or an MSI too old to
          # say) is used as given, with a warning, an upgrade included: the
          # account step applies it, and a rerun repairs a wrong one in place.
          Check "unchecked, upgrade"       (New-Plan "UseProvided" $accountSid $false) $true "other" "" "" "Install" @("could not be checked", "run this script again")
          Check "older MSI, upgrade"       $older $true "other" "" "" "Install" @("could not be checked")
          Check "older MSI, not installed" $older $true "none" "" "" "Install" @("could not be checked")
          Check "unchecked, not installed" (New-Plan "UseProvided" $accountSid $false) $true "none" "" "" "Install" @("used as given")
          Check "unchecked, same version"  (New-Plan "UseProvided" $accountSid $false) $true "same" $svc $accountSid "InPlace" @("used as given")

          # The version already installed: in place only for the account the
          # service runs as; anything else is a reinstall.
          Check "same, its account"        (New-Plan "UseProvided") $true "same" $svc $accountSid "InPlace"
          Check "same, rotate"             (New-Plan "Rotate" $accountSid $false) $true "same" $svc $accountSid "InPlace"
          Check "same, another account"    (New-Plan "UseProvided") $true "same" "HOST\monitoring" "S-1-5-21-1-2-3-1002" "Refuse" @("runs as 'HOST\monitoring'", $reinstall)
          Check "same, unresolved account" (New-Plan "UseProvided") $true "same" "LocalSystem" "" "Refuse" @("runs as 'LocalSystem'", $reinstall)
          Check "same, no service"         (New-Plan "UseProvided") $true "same" "" "" "Refuse" @("no fivenines-agent service", $reinstall)
          Check "same, account deleted"    (New-Plan "Create" $null $false) $true "same" $svc "" "Refuse" @("would create account 'fivenines-agent'", $reinstall)
          Check "same, older MSI"          $older $true "same" $svc $accountSid "Refuse" @("does not say which account", $reinstall)

          if ($script:failed -gt 0) { throw "$($script:failed) preflight verdict case(s) failed" }

      # CreateServiceAccount.ps1 -PlanOnly for real on this runner, which is
      # in no domain: the plan line carries the existing account's SID and
      # whether LogonUser answered for the password (the verdicts above rest
      # on both), an expired account is refused by name, and so is an agent
      # directory the account step would refuse to grant.
      - name: Verify the -PlanOnly plan line (sid, checked)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Get-Plan($Account, $Password) {
            $arguments = @{ ServiceAccount = $Account }
            if ($Password) { $arguments.Password = $Password }
            $line = @(& windows/installer/CreateServiceAccount.ps1 @arguments -PlanOnly) |
              Where-Object { "$_" -like "FIVENINES_PLAN *" } | Select-Object -Last 1
            if (-not $line) { throw "CreateServiceAccount.ps1 -PlanOnly printed no plan for $Account" }
            return "$line".Substring("FIVENINES_PLAN ".Length) | ConvertFrom-Json
          }
          $script:failed = 0
          function Check($Label, $Plan, $Action, $Sid, [bool]$Checked, $Mentions) {
            $keys = (@($Plan.PSObject.Properties.Name) | Sort-Object) -join ","
            $problem = $null
            if ($keys -ne "action,checked,message,sid") {
              $problem = "keys $keys"
            } elseif (-not ($Plan.checked -is [bool])) {
              $problem = "checked is not a boolean: '$($Plan.checked)'"
            } elseif ($Plan.action -ne $Action -or "$($Plan.sid)" -ne "$Sid" -or $Plan.checked -ne $Checked) {
              $problem = "$($Plan.action) sid=$($Plan.sid) checked=$($Plan.checked), expected $Action sid=$Sid checked=$Checked"
            } elseif ($Mentions -and -not "$($Plan.message)".Contains($Mentions)) {
              $problem = "the message does not mention '$Mentions': $($Plan.message)"
            }
            if ($problem) { Write-Host "FAIL $Label -> $problem"; $script:failed++ }
            else { Write-Host "ok   $Label -> $Action sid=$($Plan.sid) checked=$($Plan.checked)" }
          }
          function New-TestUser($Name, $Password) {
            New-LocalUser -Name $Name -Password (ConvertTo-SecureString $Password -AsPlainText -Force) -Description "ci: not MSI-managed" | Out-Null
            return (Get-LocalUser -Name $Name).SID.Value
          }

          $password = "Aa1-" + [guid]::NewGuid()
          $policy = Join-Path $env:TEMP "fn-plan-rights.cfg"
          $policyDb = Join-Path $env:TEMP "fn-plan-rights.sdb"
          try {
            Check "absent account" (Get-Plan ".\fn-plan-absent") "Create" $null $false $null

            $sid = New-TestUser "fn-plan-a" $password
            Check "no password"    (Get-Plan "$env:COMPUTERNAME\fn-plan-a") "Refuse" $sid $false "SERVICEACCOUNTPASSWORD"
            Check "right password" (Get-Plan ".\fn-plan-a" $password) "UseProvided" $sid $true $null
            Check "wrong password" (Get-Plan ".\fn-plan-a" "Wrong-$password") "Refuse" $sid $true "wrong password"

            # ERROR_ACCOUNT_EXPIRED (1793), refused by name.
            $sid = New-TestUser "fn-plan-b" $password
            Set-LocalUser -Name "fn-plan-b" -AccountExpires (Get-Date).AddDays(-2)
            Check "expired account" (Get-Plan ".\fn-plan-b" $password) "Refuse" $sid $true "the account has expired"

            # Network logon denied to the account, as CIS-hardened hosts deny
            # it to every local account: LogonUser answers 1385
            # (ERROR_LOGON_TYPE_NOT_GRANTED) only once the password was
            # accepted, so the right password reads as checked and a wrong one
            # still answers 1326. The entry is left for the deleted test
            # account, which this runner never reuses.
            function Add-Right($Right, $Sid) {
              secedit /export /cfg $policy /areas USER_RIGHTS /quiet | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "secedit /export failed: $LASTEXITCODE" }
              $content = @(Get-Content $policy)
              if ($content -match "^$Right\s*=") {
                $content = $content | ForEach-Object { if ($_ -match "^$Right\s*=") { $_.TrimEnd() + ",*$Sid" } else { $_ } }
              } else {
                $content = $content | ForEach-Object { $_; if ($_ -match '^\[Privilege Rights\]') { "$Right = *$Sid" } }
              }
              $content | Set-Content -Encoding ascii $policy
              secedit /configure /db $policyDb /cfg $policy /areas USER_RIGHTS /quiet | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "secedit /configure failed: $LASTEXITCODE" }
            }
            $sid = New-TestUser "fn-plan-c" $password
            Add-Right "SeDenyNetworkLogonRight" $sid
            Check "network logon denied, right password" (Get-Plan ".\fn-plan-c" $password) "UseProvided" $sid $true $null
            Check "network logon denied, wrong password" (Get-Plan ".\fn-plan-c" "Wrong-$password") "Refuse" $sid $true "wrong password"

            # An agent directory the account step would refuse to grant (here
            # a logs directory that is a junction) is refused by the plan too,
            # so the bootstraps stop before msiexec; a plain one is not.
            $programDataRoot = Join-Path $env:RUNNER_TEMP ("fn-plan-pd-" + [guid]::NewGuid())
            $elsewhere = Join-Path $programDataRoot "elsewhere"
            $planLogs = Join-Path $programDataRoot "fivenines_agent\logs"
            New-Item -ItemType Directory -Path (Join-Path $programDataRoot "fivenines_agent"), $elsewhere | Out-Null
            $savedProgramData = $env:ProgramData
            try {
              $env:ProgramData = $programDataRoot
              Check "plain agent directory" (Get-Plan ".\fn-plan-absent") "Create" $null $false $null
              cmd /c mklink /J "$planLogs" "$elsewhere" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "mklink /J failed" }
              Check "logs directory a junction" (Get-Plan ".\fn-plan-absent") "Refuse" $null $false "is a junction or a symbolic link"
              # Its target gone: the plan still refuses it, as the account
              # step would, rather than letting msiexec remove the agent.
              Remove-Item -LiteralPath $elsewhere -Force
              Check "logs directory a dangling junction" (Get-Plan ".\fn-plan-absent") "Refuse" $null $false "is a junction or a symbolic link"
              cmd /c rmdir "$planLogs" | Out-Null
            } finally {
              $env:ProgramData = $savedProgramData
            }
          } finally {
            foreach ($name in @("fn-plan-a", "fn-plan-b", "fn-plan-c")) { Remove-LocalUser -Name $name -ErrorAction SilentlyContinue }
            Remove-Item $policy, $policyDb -ErrorAction SilentlyContinue
          }
          if ($script:failed -gt 0) { throw "$($script:failed) plan line case(s) failed" }

      - name: Upload Windows coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage-windows.xml
          retention-days: 7

  build-windows-binary:
    name: Build frozen agent (PyInstaller)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools (hash-pinned)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r ci/requirements/build-tools.txt

      - name: Run Windows PyInstaller build
        shell: pwsh
        env:
          TARGET_ARCH: amd64
        run: .\py2exe_windows.ps1

      # windows-ci-* artifact names: called on a tag, this run is also
      # build-release.yml's, whose release job publishes every fivenines-agent-*
      # artifact and whose own Windows build uploads
      # fivenines-agent-windows-amd64 (two uploads of one name fail).
      - name: Upload Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-agent
          path: dist/windows/fivenines-agent-windows-amd64/
          retention-days: 7

  build-msi:
    name: Build MSI installer
    needs: build-windows-binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download agent binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ci-agent
          path: dist/windows/fivenines-agent-windows-amd64/

      - name: Download WinSW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $dst = "dist/windows/WinSW.NET4.exe"
          Invoke-WebRequest -Uri "${{ env.WINSW_URL }}" -OutFile $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash
          Write-Host "Downloaded WinSW v${{ env.WINSW_VERSION }} - SHA256: $hash"
          if ($hash -ne "${{ env.WINSW_SHA256 }}") {
            Write-Error "WinSW SHA256 mismatch: expected ${{ env.WINSW_SHA256 }}, got $hash"
            exit 1
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "${{ env.WIX_VERSION }}"
          wix extension add --global "WixToolset.Util.wixext/${{ env.WIX_VERSION }}"

      - name: Read agent version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "Agent version: $version"
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        working-directory: windows/installer
        run: |
          # AgentBinarySource = the full PyInstaller --onedir output DIR, not
          # just the .exe. The WXS harvests _internal\ from this dir via a
          # Files element; shipping only the exe leaves python311.dll behind
          # and the service fails to start with PYI "module could not be found".
          wix build .\Product.wxs `
            -ext WixToolset.Util.wixext `
            -d "Version=${{ steps.version.outputs.version }}" `
            -d "AgentBinarySource=..\..\dist\windows\fivenines-agent-windows-amd64" `
            -d "WinSwSource=..\..\dist\windows\WinSW.NET4.exe" `
            -d "WinSwConfigSource=..\winsw\fivenines-agent.xml" `
            -arch x64 `
            -o fivenines-agent.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build fivenines-agent.msi failed: $LASTEXITCODE" }
          # The same package one patch version above (#293): the E2E upgrades
          # this release to it, the path every upgrade takes once both
          # packages run without the Restart Manager.
          $v = [version]"${{ steps.version.outputs.version }}"
          wix build .\Product.wxs `
            -ext WixToolset.Util.wixext `
            -d ("Version={0}.{1}.{2}" -f $v.Major, $v.Minor, ($v.Build + 1)) `
            -d "AgentBinarySource=..\..\dist\windows\fivenines-agent-windows-amd64" `
            -d "WinSwSource=..\..\dist\windows\WinSW.NET4.exe" `
            -d "WinSwConfigSource=..\winsw\fivenines-agent.xml" `
            -arch x64 `
            -o fivenines-agent-next.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build fivenines-agent-next.msi failed: $LASTEXITCODE" }

      - name: Upload MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-msi
          path: |
            windows/installer/fivenines-agent.msi
            windows/installer/fivenines-agent-next.msi
          retention-days: 30

  smoke-msi:
    name: E2E smoke (install -> service -> report -> uninstall)
    needs: build-msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ci-msi
          path: .

      # A non-English Windows, simulated: its built-in group names are
      # translated (German here), which is what failed the install with 1603
      # for a customer -- the custom actions looked groups up by their English
      # name. Renaming the groups on this English runner reproduces exactly
      # that, so every step below must find them by SID. SYSTEM cannot be
      # renamed; the real German domain-controller run covers it.
      - name: Rename the built-in groups as a German Windows names them
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $names = @{
            "S-1-5-32-558" = "Leistungsueberwachungsbenutzer"
            "S-1-5-32-545" = "Benutzer"
            "S-1-5-32-544" = "Administratoren"
          }
          foreach ($sid in $names.Keys) {
            Rename-LocalGroup -SID $sid -NewName $names[$sid]
            Write-Host "$sid -> $((Get-LocalGroup -SID $sid).Name)"
          }
          if (Get-LocalGroup -Name "Performance Monitor Users" -ErrorAction SilentlyContinue) {
            throw "the English group name still resolves"
          }

      - name: Install MSI silently (fresh-install path - MSI provisions the account)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Real-customer fresh-install scenario: pass only TOKEN. The MSI's
          # CreateServiceAccount CA creates fivenines-agent locally, generates
          # a random password, joins it to Performance Monitor Users + Users,
          # grants SeServiceLogonRight, and flips the service to it.
          $token = "ci-smoke-token-" + (Get-Random)
          $msiArgs = "/i fivenines-agent.msi TOKEN=$token /qn /l*v install.log"
          $p = Start-Process msiexec -ArgumentList $msiArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "msiexec exit code: $($p.ExitCode)"
            Get-Content install.log -Tail 200
            exit 1
          }
          # The verbose log must not carry the token (README; a DC run found
          # it on three lines before the custom-action data was hidden). The
          # log is UTF-16 with a BOM, which ReadAllText decodes.
          if ([System.IO.File]::ReadAllText((Resolve-Path install.log)) -match [regex]::Escape($token)) {
            Write-Error "the TOKEN value is in install.log"
            exit 1
          }

      - name: Verify service account was provisioned by the MSI
        shell: pwsh
        run: |
          $u = Get-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue
          if (-not $u) {
            Write-Error "MSI did not create the 'fivenines-agent' local account"
            exit 1
          }
          Write-Host "Account created: $($u.Name) (Enabled=$($u.Enabled))"
          # Created through the WinNT provider: the flags New-LocalUser used
          # to set must still be there.
          if ($u.PasswordExpires) { Write-Error "password expires: $($u.PasswordExpires)"; exit 1 }
          if ($u.UserMayChangePassword) { Write-Error "the account may change its password"; exit 1 }
          if ($u.AccountExpires) { Write-Error "the account expires: $($u.AccountExpires)"; exit 1 }
          if ($u.Description -ne "Fivenines monitoring agent service account") {
            Write-Error "unexpected Description: '$($u.Description)'"; exit 1
          }

          # By SID, like the installer: the names are translated on a
          # non-English Windows. S-1-5-32-558 = Performance Monitor Users,
          # S-1-5-32-545 = Users.
          foreach ($g in @("S-1-5-32-558", "S-1-5-32-545")) {
            $member = Get-LocalGroupMember -SID $g -ErrorAction SilentlyContinue |
                      Where-Object { $_.SID -eq $u.SID }
            if (-not $member) {
              Write-Error "fivenines-agent is not a member of $g"
              exit 1
            }
            Write-Host "Group membership OK: $g"
          }

          # Confirm the service is configured to log in as the dedicated account,
          # not LocalSystem (the placeholder).
          $svcAccount = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").StartName
          Write-Host "Service runs as: $svcAccount"
          if ($svcAccount -notmatch "fivenines-agent") {
            Write-Error "Service is not running under the dedicated account"
            exit 1
          }

      # Under Windows PowerShell 5.1, the custom actions' runtime: an upgrade
      # re-adds the account to its groups, which must read as "already a
      # member" (matched by HRESULT: the message is translated) through the
      # installer's own helper; and the TOKEN ACL and WMI scripts must resolve
      # every spelling of the MSI's account.
      - name: Verify re-adding the account to its groups and resolving its name
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          Invoke-Expression ([regex]::Match($src, '(?m)^\$HRESULT_MEMBER_IN_ALIAS = .*$').Value)
          foreach ($fn in 'Get-WinNTUser', 'Add-AccountToBuiltinGroup') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }
          foreach ($groupSid in @("S-1-5-32-558", "S-1-5-32-545")) {
            if (Add-AccountToBuiltinGroup -GroupSid $groupSid -AccountName "fivenines-agent") {
              throw "fivenines-agent was not in $groupSid after the install"
            }
            Write-Host "Re-adding to ${groupSid}: already a member, recognized by HRESULT."
          }

          # Get-WinNTUser tells an existing account from a missing one.
          if ($null -eq (Get-WinNTUser "fivenines-agent")) { throw "Get-WinNTUser does not find fivenines-agent" }
          if ($null -ne (Get-WinNTUser "no-such-fivenines-user")) { throw "Get-WinNTUser finds an account that does not exist" }
          Write-Host "Get-WinNTUser: finds fivenines-agent, returns null for a missing account."

          $u = Get-LocalUser -Name "fivenines-agent"
          $m = [regex]::Match((Get-Content windows/installer/SetTokenFileAcl.ps1 -Raw), "(?ms)^function Resolve-ServiceAccountSid \{.*?^\}")
          Invoke-Expression $m.Value
          # The service's StartName too, as the bootstraps resolve it before
          # applying a password in place (sc.exe got the name the SID
          # translates back to).
          $startName = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").StartName
          foreach ($spelling in @("$env:COMPUTERNAME\fivenines-agent", ".\fivenines-agent", "fivenines-agent", $startName)) {
            $sid = Resolve-ServiceAccountSid $spelling
            if ($sid -ne $u.SID) { throw "'$spelling' resolved to $sid, expected $($u.SID)" }
            Write-Host "'$spelling' -> $sid"
          }

      - name: Sanity check - install dir has the PyInstaller payload
        shell: pwsh
        run: |
          $installDir = "C:\Program Files\fivenines-agent"
          $pythonDll = Join-Path $installDir "_internal\python311.dll"
          if (-not (Test-Path $pythonDll)) {
            Write-Host "Install dir contents:"
            Get-ChildItem $installDir -Recurse -Depth 1 | Format-Table Mode, Length, Name
            Write-Error "python311.dll missing - MSI did not bundle the PyInstaller _internal\ payload"
            exit 1
          }
          Write-Host "OK: $pythonDll present"

      - name: Verify service is registered and running
        shell: pwsh
        run: |
          $svc = Get-Service -Name "fivenines-agent" -ErrorAction Stop
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne "Running") {
            try {
              Start-Service -Name "fivenines-agent" -ErrorAction Stop
            } catch {
              Write-Host "Start-Service threw: $_"
            }
            Start-Sleep -Seconds 5
            $svc = Get-Service -Name "fivenines-agent"
            Write-Host "Service status after start attempt: $($svc.Status)"
          }
          if ($svc.Status -ne "Running") {
            Write-Host "=== Recent System events ==="
            Get-WinEvent -LogName System -MaxEvents 15 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match "Service Control Manager|fivenines" } |
              Format-List TimeCreated, ProviderName, LevelDisplayName, Message
            Write-Host "=== Recent Application events ==="
            Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, ProviderName, LevelDisplayName, Message
            $logDir = Join-Path $env:ProgramData "fivenines_agent\logs"
            if (Test-Path $logDir) {
              Write-Host "=== WinSW log directory ==="
              Get-ChildItem $logDir | Format-Table
              Get-ChildItem $logDir | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -Tail 50
              }
            }
            Write-Error "Service did not reach Running state"
            exit 1
          }
          # Automatic (Delayed Start), from the MSI's sc.exe config: Start 2
          # is automatic, DelayedAutostart 1 the delay. Started with the
          # plain automatic services, the agent can run its first DNS lookup
          # before DHCP has given the machine a DNS server.
          $key = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\fivenines-agent"
          Write-Host "Start=$($key.Start) DelayedAutostart=$($key.DelayedAutostart)"
          if ($key.Start -ne 2 -or $key.DelayedAutostart -ne 1) {
            Write-Error "the service is not Automatic (Delayed Start)"
            exit 1
          }
          # Restart on failure, from the MSI's sc.exe failure.
          # FailureActions is SERVICE_FAILURE_ACTIONS as the SCM stores it:
          # five DWORDs (reset period in seconds, two pointer slots, the
          # action count, a pointer slot), then one SC_ACTION per action
          # (type, delay in ms); type 1 is restart. Read from the registry,
          # since sc.exe qfailure prints localized labels.
          $bin = $key.FailureActions
          $actions = if (-not $bin) { "none" } else {
            "reset={0} {1}" -f [BitConverter]::ToUInt32($bin, 0), ((0..([BitConverter]::ToUInt32($bin, 12) - 1) |
              ForEach-Object { "{0}/{1}" -f [BitConverter]::ToUInt32($bin, 20 + 8 * $_), [BitConverter]::ToUInt32($bin, 24 + 8 * $_) }) -join " ")
          }
          Write-Host "FailureActions: $actions"
          if ($actions -ne "reset=3600 1/10000 1/30000 1/60000") {
            Write-Error "the service does not restart on failure as fivenines-agent.xml describes"
            exit 1
          }
          # Running is no proof of health now that the SCM restarts the
          # service: an agent crashing at start would be Running between
          # restarts. It must run 30s on one process, with no unexpected
          # termination of the service (SCM events 7031/7034, whose first
          # parameter names it) on this fresh runner.
          function Get-UnexpectedStops {
            @(Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; Id = 7031, 7034 } -ErrorAction SilentlyContinue |
              Where-Object { @("Fivenines Monitoring Agent", "fivenines-agent") -contains $_.Properties[0].Value })
          }
          $first = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").ProcessId
          Start-Sleep -Seconds 30
          $now = Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'"
          $stops = Get-UnexpectedStops
          if ($now.State -ne "Running" -or $now.ProcessId -ne $first -or $stops.Count -ne 0) {
            $stops | Format-List TimeCreated, Id, Message
            Write-Error "the agent did not keep running on one process: it crashed and the SCM restarted it?"
            exit 1
          }
          # Restart on failure, end to end: the agent killed (a non-zero
          # exit), WinSW exits without reporting the stop and the SCM starts
          # the service again after the first failure action's 10s.
          Get-Process -Name "fivenines-agent-windows-amd64" | Stop-Process -Force
          $restarted = $false
          for ($i = 0; $i -lt 30 -and -not $restarted; $i++) {
            Start-Sleep -Seconds 2
            $now = Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'"
            $restarted = $now.State -eq "Running" -and $now.ProcessId -ne $first
          }
          if (-not $restarted -or (Get-UnexpectedStops).Count -ne 1) {
            Get-UnexpectedStops | Format-List TimeCreated, Id, Message
            Write-Error "killing the agent did not restart the service through its failure actions"
            exit 1
          }
          Write-Host "Killed the agent: the SCM restarted the service (WinSW PID $first -> $($now.ProcessId))."

      - name: Verify TOKEN file ACL is restrictive (F1)
        shell: pwsh
        run: |
          $tokenPath = Join-Path $env:ProgramData "fivenines_agent\TOKEN"
          if (-not (Test-Path $tokenPath)) {
            Write-Error "TOKEN file missing at $tokenPath"
            exit 1
          }
          $acl = Get-Acl $tokenPath
          $principals = $acl.Access | ForEach-Object { $_.IdentityReference.Value }
          Write-Host "TOKEN ACL principals: $($principals -join ', ')"
          # The Users group must NOT have access.
          # By SID: the Users group is renamed above, as on a German Windows.
          $granted = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) |
                       ForEach-Object { $_.IdentityReference.Value })
          if ($granted -contains "S-1-5-32-545" -or $granted -contains "S-1-5-11") {
            Write-Error "TOKEN ACL too permissive - includes Users/Authenticated Users"
            exit 1
          }
          # And it must grant the three principals the installer names, matched
          # by SID: by name, Administrators and SYSTEM failed to resolve on a
          # non-English Windows and were silently left out.
          $sids = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) |
                    ForEach-Object { $_.IdentityReference.Value })
          foreach ($want in @((Get-LocalUser -Name "fivenines-agent").SID.Value, "S-1-5-32-544", "S-1-5-18")) {
            if ($sids -notcontains $want) {
              Write-Error "TOKEN ACL does not grant $want (SIDs: $($sids -join ', '))"
              exit 1
            }
          }

      # The account step's grant on the agent's two directories, as the MSI
      # leaves it: an explicit allow ACE giving the account FullControl,
      # inherited by files and subdirectories (the config dir's state files,
      # WinSW's logs). The service reaching Running shows only the log dir's.
      # Value: protects=after a real install the config and log dirs both grant the account inheritable FullControl; fails_when=the account step skips or misgrants one of them; why_new=the static test reads the call site, and the service running proves only logs; seam=none; no_claim=upgrades
      - name: Verify the agent directories grant the account FullControl
        shell: pwsh
        run: |
          $sid = (Get-LocalUser -Name "fivenines-agent").SID.Value
          foreach ($dir in @("fivenines_agent", "fivenines_agent\logs")) {
            $path = Join-Path $env:ProgramData $dir
            $grants = @((Get-Acl -LiteralPath $path).GetAccessRules($true, $false, [System.Security.Principal.SecurityIdentifier]) | Where-Object {
              $_.IdentityReference.Value -eq $sid -and "$($_.AccessControlType)" -eq "Allow" -and
              (([int]$_.FileSystemRights -band 0x1F01FF) -eq 0x1F01FF) -and
              (([int]$_.InheritanceFlags -band 3) -eq 3) -and (([int]$_.PropagationFlags -band 2) -eq 0) })
            if ($grants.Count -lt 1) {
              Write-Error "$path does not grant fivenines-agent ($sid) inheritable FullControl"
              exit 1
            }
            Write-Host "OK: $path grants $sid FullControl, inherited below it."
          }

      # fivenines_update.ps1 -ServiceAccountPassword on the version already
      # installed: the MSI alone would run in maintenance mode, never reach
      # the account and report success. The bootstrap checks the account
      # first (the MSI's own CreateServiceAccount.ps1 -PlanOnly, extracted by
      # an administrative install), refusing a wrong password before touching
      # anything, then applies a right one with that same account step and
      # restarts the service -- no msiexec run, nothing removed. Then the
      # same through fivenines_setup.ps1 with a relative -MsiPath (and a new
      # -Token, which is not written there), and two refusals that change
      # nothing: an MSI whose ProductCode cannot be read, and a service that
      # no longer runs as the account the step would update.
      - name: fivenines_update.ps1 and fivenines_setup.ps1 -ServiceAccountPassword on the installed version
        shell: powershell
        # A hung bootstrap (msiexec stuck, or the Windows Installer service
        # busy through the retries) must not hold the job for six hours.
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          $msiUrl = "file:///" + (Resolve-Path fivenines-agent.msi).Path.Replace('\', '/')
          $tokenPath = Join-Path $env:ProgramData "fivenines_agent\TOKEN"
          $token = (Get-Content $tokenPath -Raw).Trim()
          function Invoke-Update($Password, $Log, $Url = $msiUrl) {
            $secure = ConvertTo-SecureString $Password -AsPlainText -Force
            $global:LASTEXITCODE = 0
            # A refusal is an error the script writes before it exits 1 (it
            # goes on past Write-Error to exit with its own code): kept, for
            # the throw the checks below read.
            $scriptErrors = $null
            & .\fivenines_update.ps1 -MsiUrl $Url -MsiPath (Join-Path $env:TEMP "fn-update.msi") -LogFile (Join-Path $PWD $Log) -ServiceAccountPassword $secure -ErrorVariable scriptErrors
            if ($LASTEXITCODE -ne 0) { throw ("fivenines_update.ps1 exited {0}: {1}" -f $LASTEXITCODE, ($scriptErrors -join " ")) }
          }
          function Assert-Installed {
            $agent = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -match "Fivenines Monitoring Agent" }
            if (-not $agent) { throw "the agent is no longer installed" }
            for ($i = 0; $i -lt 30; $i++) {
              if ((Get-Service -Name "fivenines-agent").Status -eq "Running") { return }
              Start-Sleep -Seconds 2
            }
            throw "the service is not Running"
          }

          $refused = $null
          try { Invoke-Update ("Wrong-" + [guid]::NewGuid()) "update-wrong.log" } catch { $refused = "$_" }
          if (-not $refused -or $refused -notmatch "does not log") { throw "a wrong password was not refused before msiexec: $refused" }
          if (Test-Path "update-wrong.log") { throw "msiexec ran although the preflight refused" }
          Assert-Installed
          Write-Host "Wrong password refused before msiexec; the agent is still installed and Running."

          $password = 'Fn9 r$i;ght\pw_' + (Get-Random)
          Set-LocalUser -Name "fivenines-agent" -Password (ConvertTo-SecureString $password -AsPlainText -Force)
          Invoke-Update $password "update-right.log"
          Assert-Installed
          Restart-Service -Name "fivenines-agent"
          Assert-Installed
          if (Test-Path "update-right.log") { throw "msiexec ran although this version was already installed" }
          Write-Host "Right password applied to the installed agent by the MSI's own account step; the service restarts with it."

          # fivenines_setup.ps1 with a RELATIVE -MsiPath, from a location that
          # is not the process's working directory: the ProductCode read (COM)
          # used to resolve it against the latter, find no MSI and let msiexec
          # run a maintenance pass that applied nothing. The new -Token is not
          # written on this path, and the script says so.
          $repo = $PWD.Path
          $tokenBefore = Get-Content $tokenPath -Raw
          # The script's warnings, as the operator sees them.
          $transcript = Join-Path $env:TEMP "fn-setup-in-place.txt"
          Push-Location $env:TEMP
          Start-Transcript -Path $transcript | Out-Null
          try {
            $global:LASTEXITCODE = 0
            & (Join-Path $repo "fivenines_setup.ps1") -Token ("ci-new-token-" + (Get-Random)) -MsiUrl $msiUrl `
              -MsiPath "fn-setup-relative.msi" -LogFile (Join-Path $repo "setup-in-place.log") `
              -ServiceAccountPassword (ConvertTo-SecureString $password -AsPlainText -Force)
            if ($LASTEXITCODE -ne 0) { throw "fivenines_setup.ps1 exited $LASTEXITCODE" }
          } finally {
            Stop-Transcript | Out-Null
            Pop-Location
          }
          if (Test-Path "setup-in-place.log") { throw "msiexec ran: the relative -MsiPath was not read as the installed version" }
          if ((Get-Content $transcript -Raw) -notmatch "-Token was not written") { throw "fivenines_setup.ps1 did not warn that -Token was not written" }
          if ((Get-Content $tokenPath -Raw) -ne $tokenBefore) { throw "the TOKEN file changed" }
          Assert-Installed
          Write-Host "fivenines_setup.ps1 with a relative -MsiPath applied the password in place, kept TOKEN and said so."

          # An MSI whose ProductCode cannot be read (any file that is not
          # one): it may be this very version, so a password is refused.
          $refused = $null
          try { Invoke-Update $password "update-unreadable.log" ("file:///" + (Resolve-Path README.md).Path.Replace('\', '/')) } catch { $refused = "$_" }
          if (-not $refused -or $refused -notmatch "ProductCode") { throw "an MSI whose ProductCode cannot be read was not refused: $refused" }
          if (Test-Path "update-unreadable.log") { throw "msiexec ran although the preflight refused" }
          Assert-Installed
          Write-Host "An unreadable ProductCode is refused before msiexec."

          # The service moved to another account (LocalSystem here): the step
          # would move it back to fivenines-agent without the rest of an
          # install, so it is refused, and the service keeps its account.
          # sc.exe needs no password for LocalSystem.
          $scOut = & sc.exe config fivenines-agent obj= LocalSystem 2>&1
          if ($LASTEXITCODE -ne 0) { throw "sc.exe config obj= LocalSystem failed: $scOut" }
          try {
            $refused = $null
            try { Invoke-Update $password "update-other-account.log" } catch { $refused = "$_" }
            if (-not $refused -or $refused -notmatch "runs as 'LocalSystem'") { throw "the step for an account the service does not run as was not refused: $refused" }
            if (Test-Path "update-other-account.log") { throw "msiexec ran although the preflight refused" }
            $startName = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").StartName
            if ($startName -ne "LocalSystem") { throw "the refused step changed the service's account to '$startName'" }
          } finally {
            # Back to the account, as CreateServiceAccount.ps1 sets it.
            $scArgs = @("config", "fivenines-agent", "obj=", "$env:COMPUTERNAME\fivenines-agent", "password=", $password)
            $scOut = & sc.exe @scArgs 2>&1
            if ($LASTEXITCODE -ne 0) { throw "sc.exe config back to fivenines-agent failed: $scOut" }
          }
          Restart-Service -Name "fivenines-agent"
          Assert-Installed
          Write-Host "A service running as another account is refused; its account is untouched."

          foreach ($log in Get-ChildItem -Filter "*.log") {
            $text = [System.IO.File]::ReadAllText($log.FullName)
            if ($text.Contains($password)) { throw "the password is in $($log.Name)" }
            if ($text.Contains($token)) { throw "the TOKEN value is in $($log.Name)" }
          }
          Write-Host "No secret in any log."

      # A repair (Programs and Features > Repair, msiexec /f) stops the agent
      # through the package's ServiceControl, and without the Restart Manager
      # (#293) only StartAgentService, run on every install but an uninstall,
      # starts it again. The repair must leave the account, the delayed start
      # and the restart on failure as the install set them.
      - name: Repair restarts the agent with its account and start configuration
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          function Get-ServiceState {
            $key = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\fivenines-agent"
            return [pscustomobject]@{
              Account = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").StartName
              Start = [int]$key.Start; Delayed = [int]$key.DelayedAutostart
              Failure = [BitConverter]::ToString([byte[]]$key.FailureActions)
            }
          }
          $before = Get-ServiceState
          Write-Host "before the repair: $before"
          $since = Get-Date
          $p = Start-Process msiexec -ArgumentList "/fa fivenines-agent.msi /qn /l*v repair.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /fa failed: $($p.ExitCode)" }
          for ($i = 0; $i -lt 30 -and (Get-Service -Name "fivenines-agent").Status -ne "Running"; $i++) { Start-Sleep -Seconds 2 }
          $after = Get-ServiceState
          Write-Host "after the repair: $after"
          if ((Get-Service -Name "fivenines-agent").Status -ne "Running") { throw "the repair left the agent stopped" }
          if ($after.Account -ne $before.Account) { throw "the repair moved the service from $($before.Account) to $($after.Account)" }
          if ($after.Start -ne $before.Start -or $after.Delayed -ne $before.Delayed) { throw "the repair changed the service's start type" }
          if ($after.Failure -ne $before.Failure) { throw "the repair changed the service's failure actions" }
          $first = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").ProcessId
          Start-Sleep -Seconds 20
          $stops = @(Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; Id = 7031, 7034; StartTime = $since } -ErrorAction SilentlyContinue |
                     Where-Object { @("Fivenines Monitoring Agent", "fivenines-agent") -contains $_.Properties[0].Value })
          if ((Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").ProcessId -ne $first -or $stops.Count -ne 0) {
            throw "the repaired agent did not keep running on one process"
          }
          Write-Host "Repaired: the agent runs as $($after.Account) on one process, its start type and failure actions unchanged."

      - name: Uninstall MSI silently
        shell: pwsh
        run: |
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall.log" -Wait

      - name: Verify uninstall removed service + config dir
        shell: pwsh
        run: |
          $svc = Get-Service -Name "fivenines-agent" -ErrorAction SilentlyContinue
          if ($null -ne $svc) {
            Write-Error "Service still registered after uninstall"
            exit 1
          }
          $configDir = Join-Path $env:ProgramData "fivenines_agent"
          if (Test-Path $configDir) {
            Write-Warning "Config dir survived uninstall: $configDir"
            Get-ChildItem $configDir -Recurse | Out-String
          }

      # Three installs over what earlier ones left, then the uninstall script:
      # 1. the account kept (an upgrade or reinstall): Rotate, through WinNT
      #    SetPassword, on a local SAM -- the DC run is the only other place
      #    it runs;
      # 2. the account deleted by hand, so its ACE on the WMI Storage
      #    namespace names a SID that no longer resolves: the WMI delegation
      #    must cope (GetSecurityDescriptor failed outright on one, which a
      #    domain controller showed). That install passes the password, one
      #    with a space, a '-', '$', ';' and an inner '\', as an operator
      #    would: the service runs only if it reached sc.exe intact;
      # 3. fivenines_uninstall.ps1 must delete the account and its grant.
      - name: Reinstall keeping the account, over an orphaned WMI grant, then fivenines_uninstall.ps1
        shell: powershell
        # A hung bootstrap (msiexec stuck, or the Windows Installer service
        # busy through the retries) must not hold the job for six hours.
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/DelegateWmiStorageNamespace.ps1 -Raw
          Invoke-Expression ([regex]::Match($src, "(?ms)^function Get-WmiNamespaceSD \{.*?^\}").Value)
          function Get-StorageAceSids {
            $sd = Get-WmiNamespaceSD "root\Microsoft\Windows\Storage"
            return @($sd.DiscretionaryAcl | Where-Object { $_ -is [System.Security.AccessControl.KnownAce] } |
                     ForEach-Object { $_.SecurityIdentifier.Value })
          }
          function Install-Msi($Log, $Extra, $Secret) {
            $token = "ci-reinstall-$(Get-Random)"
            $arguments = "/i fivenines-agent.msi TOKEN=$token /qn /l*v $Log $Extra"
            $p = Start-Process msiexec -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $Log | Select-String "WixQuietExec" | Where-Object { $_.Line -notmatch "powershell\.exe" } |
                Select-Object -Last 40 | ForEach-Object { $_.Line }
              throw "msiexec ($Log) failed: $($p.ExitCode)"
            }
            $text = [System.IO.File]::ReadAllText((Resolve-Path $Log))
            if ($text.Contains($token)) { throw "the TOKEN value is in $Log" }
            if ($Secret -and $text.Contains($Secret)) { throw "the service account password is in $Log" }
          }
          function Wait-Running {
            for ($i = 0; $i -lt 30; $i++) {
              if ((Get-Service -Name "fivenines-agent" -ErrorAction SilentlyContinue).Status -eq "Running") { return }
              Start-Sleep -Seconds 2
            }
            throw "the service did not reach Running"
          }

          # 1. Rotate.
          $kept = Get-LocalUser -Name "fivenines-agent"
          Install-Msi "rotate.log" ""
          Wait-Running
          $after = Get-LocalUser -Name "fivenines-agent"
          if ($after.SID -ne $kept.SID) { throw "the reinstall replaced the account instead of rotating it" }
          if ($after.Description -ne $kept.Description) { throw "the reinstall retagged a member server's account: '$($after.Description)'" }
          if (-not $after.PasswordLastSet -or $after.PasswordLastSet -le $kept.PasswordLastSet) { throw "the password was not rotated" }
          Write-Host "Reinstalled over the kept account: rotated, same SID and tag, service Running."
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall-rotate.log" -Wait | Out-Null

          # 2. Orphaned grant, operator password.
          $orphan = $after.SID.Value
          Remove-LocalUser -Name "fivenines-agent"
          if ((Get-StorageAceSids) -notcontains $orphan) { throw "expected the deleted account's WMI grant to remain" }
          Write-Host "Deleted fivenines-agent by hand; its WMI grant ($orphan) remains."
          $password = 'Fn9 -p$a;ss\w0rd_' + (Get-Random)
          Install-Msi "reinstall.log" ('SERVICEACCOUNTPASSWORD="{0}"' -f $password) $password
          Wait-Running
          $sid = (Get-LocalUser -Name "fivenines-agent").SID.Value
          $count = @(Get-StorageAceSids | Where-Object { $_ -eq $sid }).Count
          if ($count -ne 1) { throw "expected exactly one WMI grant for $sid, found $count" }
          Write-Host "Reinstalled as $sid with the operator's password, granted once, service Running."

          # 3. The uninstall script.
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall2.log" -Wait | Out-Null
          & .\fivenines_uninstall.ps1 -LogFile uninstall-script.log
          if (Get-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue) { throw "fivenines_uninstall.ps1 kept the account" }
          if ((Get-StorageAceSids) -contains $sid) { throw "fivenines_uninstall.ps1 left the WMI grant for $sid" }
          Write-Host "fivenines_uninstall.ps1 deleted the account and its WMI grant."

      # An existing install gets the delayed start and the restart on failure
      # through an upgrade: v1.22.1's MSI registered the service plain
      # Automatic with no failure actions (checksum from that release's
      # SHA256SUMS), and this MSI, a major upgrade over it, must leave the
      # service Automatic (Delayed Start), restarted after a failure.
      - name: Upgrade from v1.22.1 sets the delayed start and the restart on failure
        shell: powershell
        timeout-minutes: 15
        env:
          OLD_MSI_URL: https://github.com/Five-Nines-io/fivenines_agent/releases/download/v1.22.1/fivenines-agent-windows-amd64.msi
          OLD_MSI_SHA256: 537e913d5f5149ec1d01a52c573b81a0fde97626c627861fda3772fbe62bdf36
        run: |
          $ErrorActionPreference = "Stop"
          & curl.exe -fsSL --retry 3 -o old.msi $env:OLD_MSI_URL
          if ($LASTEXITCODE -ne 0) { throw "downloading v1.22.1's MSI failed: $LASTEXITCODE" }
          $hash = (Get-FileHash old.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:OLD_MSI_SHA256) { throw "old.msi has SHA-256 $hash, expected $env:OLD_MSI_SHA256" }
          function Install-Msi($Msi, $Log) {
            $p = Start-Process msiexec -ArgumentList "/i $Msi TOKEN=ci-upgrade-$(Get-Random) /qn /l*v $Log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /i $Msi ($Log) failed: $($p.ExitCode)" }
          }
          function Get-StartType {
            $key = Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\fivenines-agent"
            # FailureActions decoded as in "Verify service is registered and running".
            $bin = $key.FailureActions
            $actions = if (-not $bin) { "none" } else {
              "reset={0} {1}" -f [BitConverter]::ToUInt32($bin, 0), ((0..([BitConverter]::ToUInt32($bin, 12) - 1) |
                ForEach-Object { "{0}/{1}" -f [BitConverter]::ToUInt32($bin, 20 + 8 * $_), [BitConverter]::ToUInt32($bin, 24 + 8 * $_) }) -join " ")
            }
            # [int]$null is 0: a service never set delayed has no such value.
            return [pscustomobject]@{ Start = [int]$key.Start; Delayed = [int]$key.DelayedAutostart; Failure = $actions }
          }
          # The upgrade removes the older product first: a service still
          # starting then can hang its stop, as an uninstall a second after an
          # install did on a domain controller.
          function Wait-Running($Label) {
            for ($i = 0; $i -lt 30 -and (Get-Service -Name "fivenines-agent").Status -ne "Running"; $i++) { Start-Sleep -Seconds 2 }
            if ((Get-Service -Name "fivenines-agent").Status -ne "Running") { throw "the service did not reach Running after $Label" }
          }

          Install-Msi old.msi upgrade-old.log
          Wait-Running "v1.22.1's install"
          $before = Get-StartType
          Write-Host "v1.22.1: Start=$($before.Start) DelayedAutostart=$($before.Delayed) FailureActions: $($before.Failure)"
          # Without this precondition the step would pass whatever the upgrade did.
          if ($before.Start -ne 2 -or $before.Delayed -ne 0 -or $before.Failure -ne "none") {
            throw "v1.22.1 was expected to register the service plain Automatic, with no failure actions"
          }

          # The agent's stderr from here on: what a first start that died wrote.
          $errLog = "$env:ProgramData\fivenines_agent\logs\fivenines-agent-service.err.log"
          $errFrom = 0
          if (Test-Path -LiteralPath $errLog) { $errFrom = (Get-Item -LiteralPath $errLog).Length }
          $since = Get-Date
          Install-Msi fivenines-agent.msi upgrade.log
          # Without the installer's Restart Manager (#293): its session ended
          # after StartAgentService, refusing the new agent's reads of its
          # files for a few ms, and the agent died at its first start on about
          # one upgrade in four. v1.22.1's own session, in the uninstall the
          # upgrade runs, still shows in the log; this line is the upgrade's.
          if (-not (Get-Content upgrade.log | Select-String -SimpleMatch -Quiet "RESTART MANAGER: Disabled by MSIRESTARTMANAGERCONTROL property")) {
            throw "the upgrade ran with the Restart Manager: MSIRESTARTMANAGERCONTROL is not Disable"
          }
          $products = @(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                        Where-Object { $_.DisplayName -eq "Fivenines Monitoring Agent" })
          if ($products.Count -ne 1 -or $products[0].DisplayVersion -eq "1.22.1") {
            throw ("expected the upgrade to replace v1.22.1, installed: {0}" -f (($products | ForEach-Object { $_.DisplayVersion }) -join ", "))
          }
          $after = Get-StartType
          Write-Host "after the upgrade to $($products[0].DisplayVersion): Start=$($after.Start) DelayedAutostart=$($after.Delayed) FailureActions: $($after.Failure)"
          if ($after.Start -ne 2 -or $after.Delayed -ne 1) { throw "the upgrade left the service without the delayed start" }
          if ($after.Failure -ne "reset=3600 1/10000 1/30000 1/60000") { throw "the upgrade left the service without its restart on failure" }
          Wait-Running "the upgrade"
          # As after the fresh install: Running between SCM restarts is no
          # proof, so the upgraded agent must keep one process for 20s, with
          # no unexpected termination of the service since the upgrade began.
          $first = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").ProcessId
          Start-Sleep -Seconds 20
          $stops = @(Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; Id = 7031, 7034; StartTime = $since } -ErrorAction SilentlyContinue |
                     Where-Object { @("Fivenines Monitoring Agent", "fivenines-agent") -contains $_.Properties[0].Value })
          # Every SCM event about the service since the upgrade began, passing
          # or not: which service instance stopped, and when, is what tells an
          # old v1.22.1 agent dying during the upgrade from the new one
          # crashing after it.
          Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; StartTime = $since } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match "Fivenines Monitoring Agent|fivenines-agent" } | Sort-Object TimeCreated |
            ForEach-Object { Write-Host ("{0:HH:mm:ss.fff} {1} {2}" -f $_.TimeCreated, $_.Id, ($_.Message -replace "\s+", " ")) }
          # One stop is tolerated, and only this one (#293). v1.22.1's own
          # Restart Manager session, in the uninstall the upgrade runs, ends
          # after StartAgentService and still refuses reads of the installed
          # files for a few ms (measured in 7 upgrades of 27; the upgraded
          # package's own session, now disabled, in 6 of 9): a first start
          # caught then dies in PyInstaller's bootstrap, before any agent code,
          # on base_library.zip, and the SCM restarts it. An upgrade from a
          # release that disables the Restart Manager has no such session.
          $bootstrapDeath = $false
          if ($stops.Count -eq 1 -and (Test-Path -LiteralPath $errLog)) {
            $fs = New-Object IO.FileStream($errLog, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
            try {
              $fs.Position = [Math]::Min($errFrom, $fs.Length)
              $newErr = (New-Object IO.StreamReader($fs)).ReadToEnd()
            } finally {
              $fs.Dispose()
            }
            $bootstrapDeath = ([regex]::Matches($newErr, "Traceback \(most recent call last\)").Count -eq 1) -and
              ([regex]::Matches($newErr, "(?m)^PermissionError: \[Errno 13\] Permission denied: '[^'\r\n]*\\\\_internal\\\\base_library\.zip'\r?$").Count -eq 1) -and
              ([regex]::Matches($newErr, "\[PYI-\d+:ERROR\] Failed to execute script 'pyi[^']*' due to unhandled exception").Count -eq 1)
            if ($bootstrapDeath) {
              Write-Host "Tolerated (#293): the first start died in PyInstaller's bootstrap, refused base_library.zip by v1.22.1's Restart Manager session:"
              $newErr -split "\r?\n" | Where-Object { $_ } | ForEach-Object { Write-Host "  $_" }
            }
          }
          $svc = Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'"
          if ($svc.ProcessId -ne $first -or ($stops.Count -ne 0 -and -not $bootstrapDeath)) {
            Write-Host "service: State=$($svc.State) WinSW PID $first -> $($svc.ProcessId); unexpected stops: $($stops.Count)$(if ($bootstrapDeath) { ' (that one tolerated, #293)' })"
            # WinSW's own log and the agent's captured stdout/stderr: v1.22.1's
            # lines first, then the upgraded agent's (the files are appended).
            Get-ChildItem "$env:ProgramData\fivenines_agent\logs" -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.Name) (last 60 lines)"
              Get-Content $_.FullName -Tail 60 | ForEach-Object { Write-Host $_ }
            }
            throw "the upgraded agent did not keep running on one process: it crashed and the SCM restarted it?"
          }
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall-upgrade.log" -Wait | Out-Null

      # The upgrade every install takes once it runs this release (#293): both
      # the upgrading package and the one it uninstalls run without the
      # Restart Manager, so no session opens, nothing refuses the new agent's
      # reads, and its first start must survive with no tolerance at all.
      - name: Upgrade from this release opens no Restart Manager session
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          function Install-Msi($Msi, $Log) {
            $p = Start-Process msiexec -ArgumentList "/i $Msi TOKEN=ci-steady-$(Get-Random) /qn /l*v $Log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /i $Msi ($Log) failed: $($p.ExitCode)" }
          }
          function Wait-Running($Label) {
            for ($i = 0; $i -lt 30 -and (Get-Service -Name "fivenines-agent").Status -ne "Running"; $i++) { Start-Sleep -Seconds 2 }
            if ((Get-Service -Name "fivenines-agent").Status -ne "Running") { throw "the service did not reach Running after $Label" }
          }
          Install-Msi fivenines-agent.msi steady-old.log
          Wait-Running "this release's install"
          $old = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "Fivenines Monitoring Agent" }).DisplayVersion
          $since = Get-Date
          Install-Msi fivenines-agent-next.msi steady.log
          $new = @(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "Fivenines Monitoring Agent" })
          if ($new.Count -ne 1 -or $new[0].DisplayVersion -eq $old) { throw "expected the upgrade to replace $old, installed: $(($new | ForEach-Object { $_.DisplayVersion }) -join ', ')" }
          $log = Get-Content steady.log
          $disabled = @($log | Select-String -SimpleMatch "RESTART MANAGER: Disabled by MSIRESTARTMANAGERCONTROL property").Count
          $sessions = @($log | Select-String -SimpleMatch "RESTART MANAGER: Session opened").Count
          Write-Host "$old -> $($new[0].DisplayVersion): Restart Manager disabled $disabled time(s), $sessions session(s) opened"
          # Twice: the upgrade's own session and the uninstall it runs.
          if ($disabled -lt 2 -or $sessions -ne 0) { throw "the upgrade from this release still used the Restart Manager" }
          Wait-Running "the upgrade"
          $first = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").ProcessId
          Start-Sleep -Seconds 20
          $stops = @(Get-WinEvent -FilterHashtable @{ LogName = "System"; ProviderName = "Service Control Manager"; Id = 7031, 7034; StartTime = $since } -ErrorAction SilentlyContinue |
                     Where-Object { @("Fivenines Monitoring Agent", "fivenines-agent") -contains $_.Properties[0].Value })
          if ((Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").ProcessId -ne $first -or $stops.Count -ne 0) {
            Get-ChildItem "$env:ProgramData\fivenines_agent\logs" -File -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.Name) (last 60 lines)"
              Get-Content $_.FullName -Tail 60 | ForEach-Object { Write-Host $_ }
            }
            throw "the agent upgraded from this release did not keep running on one process"
          }
          Write-Host "Upgraded from this release with no Restart Manager session and no stop."
          Start-Process msiexec -ArgumentList "/x fivenines-agent-next.msi /qn /l*v uninstall-steady.log" -Wait | Out-Null

      - name: Cleanup service account
        if: always()
        shell: pwsh
        run: Remove-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue

      - name: Upload install/uninstall logs (on failure or always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: |
            install.log
            uninstall.log
            rotate.log
            uninstall-rotate.log
            reinstall.log
            uninstall2.log
            upgrade-old.log
            upgrade.log
            uninstall-upgrade.log
            repair.log
            steady-old.log
            steady.log
            uninstall-steady.log
          retention-days: 7
          if-no-files-found: ignore

  # Whether this push changed what the domain-controller E2E tests: the MSI
  # sources (windows/installer/, and windows/winsw/ for the service it
  # installs), the bootstrap scripts, the DC harness or this workflow (their
  # Markdown aside). Compared cumulatively, so a run a newer push cancelled
  # (the concurrency group cancels a running one) is made up by the next:
  # main with the latest v* tag, any other branch with where it left main.
  # Never on a tag: the main push before it ran it for every installer change
  # since the last release.
  installer-changed:
    name: Installer changed?
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare with the latest release or where the branch left main
        id: diff
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
            if [ -n "$tag" ]; then
              base=$(git rev-parse "${tag}^{commit}")
            else
              base=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            fi
          else
            base=$(git merge-base origin/main HEAD)
          fi
          # A head that is its own base (a branch at main's tip, a main commit
          # that is the tag): compared with the commit before it.
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse HEAD^)
          fi
          echo "Comparing ${base} with $(git rev-parse HEAD)"
          # Markdown under those directories is documentation, not tested.
          # --no-renames: a file moved out of a watched directory counts.
          files=$(git diff --name-only --no-renames "$base" HEAD | grep -v '\.md$' || true)
          if printf '%s\n' "$files" | grep -E '^(windows/installer/|windows/winsw/|ci/windows-dc/|fivenines_(setup|update|uninstall)\.ps1$|\.github/workflows/windows\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No installer file changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The MSI on real domain controllers, which no GitHub runner can become
  # (promotion needs a reboot): a Windows Server 2019 evaluation VM in
  # QEMU/KVM on a Linux runner, installed in English and in German, promoted
  # to the first DC of a new forest. It first reproduces the failure a trial
  # reported with v1.22.0, then plays every account scenario a DC meets
  # (ci/windows-dc/stage2.ps1). About an hour, so it runs only on a push that
  # changed the installer (installer-changed above), or on request:
  #   gh workflow run windows.yml --ref <branch> -f domain_controller=true
  # A release never waits for it: it downloads Microsoft's evaluation ISOs,
  # which can change or disappear without any change here.
  smoke-msi-domain-controller:
    name: E2E on a domain controller (Server 2019 ${{ matrix.lang }})
    needs: [build-msi, installer-changed]
    if: >-
      ${{ !cancelled() && needs.build-msi.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain_controller) ||
      (github.event_name == 'push' && needs.installer-changed.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          # Microsoft's evaluation ISOs (go.microsoft.com/fwlink LinkID
          # 2195167); Microsoft publishes no checksum for them, so these are
          # the SHA-256 of two identical downloads, 2026-11-03.
          - lang: en-US
            culture: en-us
            clcid: "0x409"
            country: US
            iso_sha256: 6dae072e7f78f4ccab74a45341de0d6e2d45c39be25f1f5920a2ab4f51d7bcbb
          - lang: de-DE
            culture: de-de
            clcid: "0x407"
            country: DE
            iso_sha256: 82115b58c188847a79f70c3b46841c675d66c9fe259c8722e23ddf6197042624
    env:
      # The last release before domain-controller support, whose 1603 on a DC
      # the run reproduces first; checksum from that release's signed
      # SHA256SUMS.
      OLD_MSI_URL: https://github.com/Five-Nines-io/fivenines_agent/releases/download/v1.22.0/fivenines-agent-windows-amd64.msi
      OLD_MSI_SHA256: 0307513ecd13ac4530241e97f82df55789ee1cf78a36a63cc50740f774c1291c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ci-msi
          path: msi

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils genisoimage wimtools socat ntfs-3g

      - name: Enable KVM access
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Download the evaluation ISO and v1.22.0's MSI (checksums verified)
        env:
          CULTURE: ${{ matrix.culture }}
          CLCID: ${{ matrix.clcid }}
          COUNTRY: ${{ matrix.country }}
          ISO_SHA256: ${{ matrix.iso_sha256 }}
        run: |
          sudo mkdir -p /mnt/fn
          sudo chown "$(id -u):$(id -g)" /mnt/fn
          curl -fsSL --retry 3 -o /mnt/fn/server.iso \
            "https://go.microsoft.com/fwlink/p/?LinkID=2195167&clcid=${CLCID}&culture=${CULTURE}&country=${COUNTRY}"
          echo "${ISO_SHA256}  /mnt/fn/server.iso" | sha256sum -c -
          curl -fsSL --retry 3 -o /mnt/fn/old.msi "$OLD_MSI_URL"
          echo "${OLD_MSI_SHA256}  /mnt/fn/old.msi" | sha256sum -c -

      - name: Install, promote and test the domain controller
        env:
          LANG_TAG: ${{ matrix.lang }}
        run: |
          ci/windows-dc/run-vm.sh /mnt/fn/server.iso "$LANG_TAG" msi/fivenines-agent.msi /mnt/fn/old.msi /mnt/fn/out

      - name: Upload the VM's serial log, screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domain-controller-${{ matrix.lang }}
          path: /mnt/fn/out
          retention-days: 7
          if-no-files-found: ignore
