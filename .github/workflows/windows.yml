name: Windows Build

# Windows CI for the agent: tests, frozen-binary build, MSI build, and the
# end-to-end install smoke (D14 + D20 - CI is the quality gate for the
# single combined release).
#
# build-release.yml calls this workflow on a v* tag (workflow_call) and its
# release job waits for it, so a release whose MSI fails the member-server
# E2E is never published. It therefore does not trigger on tags itself.
#
# Coverage handling per D3: the per-OS pytest run uses --cov but NOT
# --cov-fail-under (Windows alone cannot reach 100% because Linux-only
# branches are unreachable here, and vice versa on the Linux CI in
# build-release.yml). The combined-coverage gate that merges both OS runs
# is a follow-up; tracked in TODOS.md. For now, the per-OS coverage XML is
# uploaded as an artifact so it can be aggregated externally.

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'spuyet/windows-server-support'
  workflow_call:
  workflow_dispatch:
    inputs:
      domain_controller:
        description: "Also run the MSI E2E on real domain controllers (Server 2019 VMs, English and German, ~1h)"
        type: boolean
        default: false

# A literal group, not github.workflow: in a called workflow that names the
# CALLER, and sharing build-release.yml's group would make the call wait for
# its own caller.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Nothing here writes to the repository, whatever the default token allows.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  # Poetry and the other build tools are pinned, with hashes, in
  # ci/requirements/build-tools.txt.
  # WiX 5+ - need the <Files> harvesting element, which WiX 4 does not have.
  # Pinned to a stable 5.x so the schema we author against stays predictable;
  # WiX 6/7 introduce further changes (e.g. some default behavior shifts).
  WIX_VERSION: '5.0.2'
  # WinSW v2 (.NET Framework 4 - in-box on Server 2019/2022/2025 + Win 10/11)
  WINSW_VERSION: '2.12.0'
  WINSW_URL: 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe'
  # SHA256 of WinSW.NET4.exe v2.12.0 published binary. Verified against the
  # GitHub release artifact via multiple consecutive green CI runs.
  WINSW_SHA256: '923111C7142B3DC783A3C722B19B8A21BCB78222D7A136AC33F0CA8A29F4CB66'

jobs:
  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools (hash-pinned)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r ci/requirements/build-tools.txt

      - name: Install dependencies (windows group, virtualization excluded)
        shell: pwsh
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --without virtualization --with windows --with test

      - name: Run tests with coverage (no fail-under per D3)
        shell: pwsh
        run: |
          poetry run pytest tests/ `
            --cov=fivenines_agent `
            --cov-report=xml:coverage-windows.xml `
            --cov-report=term-missing

      # The MSI's password generator, exercised against the real PowerShell.
      # The bug this guards used to fail roughly one install in 770 - rare
      # enough to look like CI flake, frequent enough to be a customer's
      # failed install - and the E2E smoke job that eventually caught it only
      # runs after the MSI is built, so it never fenced the generator itself.
      # The function is extracted rather than dot-sourced because the script
      # is a custom action with mandatory parameters and Windows-only cmdlets.
      - name: Verify service-account password generation
        shell: pwsh
        run: |
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          foreach ($fn in 'Get-RandomIndex', 'Get-RandomChar', 'New-RandomPassword') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }

          # New-LocalUser enforces the machine password policy, which wants at
          # least three of {upper, lower, digit, non-alphanumeric}. Assert all
          # four on every draw, so a regression cannot reintroduce a rare miss.
          $seen = @{}
          for ($i = 0; $i -lt 2000; $i++) {
            $pw = New-RandomPassword
            if ($pw.Length -ne 32) { throw "length $($pw.Length), expected 32: $pw" }
            if ($pw -notmatch '[A-Z]')      { throw "no uppercase: $pw" }
            if ($pw -notmatch '[a-z]')      { throw "no lowercase: $pw" }
            if ($pw -notmatch '[0-9]')      { throw "no digit: $pw" }
            if ($pw -notmatch '[-_]')       { throw "no non-alphanumeric: $pw" }
            if ($pw -match '[^A-Za-z0-9_-]') { throw "character outside the sc.exe-safe alphabet: $pw" }
            $seen[$pw] = $true
          }
          if ($seen.Count -ne 2000) { throw "generated a duplicate password in 2000 draws" }

          # The guaranteed characters must not sit in a fixed order at the
          # front: that would leak four positions of the password's structure.
          $firstDigitPositions = @{}
          for ($i = 0; $i -lt 500; $i++) {
            $firstDigitPositions[(New-RandomPassword).IndexOfAny('0123456789'.ToCharArray())] = $true
          }
          if ($firstDigitPositions.Count -lt 10) {
            throw "first digit landed in only $($firstDigitPositions.Count) distinct positions - is the shuffle running?"
          }

          Write-Host "2000 passwords: length 32, all four character classes, no duplicates, shuffled."

      # The service-account rules, under Windows PowerShell 5.1 (the custom
      # actions' runtime). The domain-controller cases cannot run for real
      # here -- promoting a runner to a DC needs a reboot -- so the decision
      # lives in a pure function, Get-AccountPlan, exercised case by case.
      - name: Verify service-account rules (domain-controller cases included)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          foreach ($name in 'MSI_MANAGED_DESCRIPTION', 'DC_MANAGED_PREFIX', 'DC_OPERATOR_DESCRIPTION') {
            $m = [regex]::Match($src, ('(?m)^\${0} = ".*"' -f $name))
            if (-not $m.Success) { throw "`$$name not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }
          $m = [regex]::Match($src, "(?ms)^function Get-AccountPlan \{.*?^\}")
          if (-not $m.Success) { throw "Get-AccountPlan not found in CreateServiceAccount.ps1" }
          Invoke-Expression $m.Value

          # A SAM account comment (Description) holds at most 48 characters;
          # a NetBIOS computer name is at most 15.
          foreach ($d in @($MSI_MANAGED_DESCRIPTION, $DC_OPERATOR_DESCRIPTION, ($DC_MANAGED_PREFIX + ('X' * 15)))) {
            if ($d.Length -gt 48) { throw "Description over 48 characters: '$d'" }
          }

          # The uninstall script deletes a DC's account only when it carries
          # this DC's tag, so it must spell the prefix the same way.
          $uninstall = Get-Content fivenines_uninstall.ps1 -Raw
          foreach ($name in 'DC_MANAGED_PREFIX', 'MSI_MANAGED_DESCRIPTION') {
            $line = [regex]::Match($src, ('(?m)^\${0} = ".*"' -f $name)).Value
            if (-not $uninstall.Contains($line)) { throw "fivenines_uninstall.ps1 does not carry: $line" }
          }

          $own = $DC_MANAGED_PREFIX + "DC1"
          $other = $DC_MANAGED_PREFIX + "DC2"
          $script:failed = 0
          function Check($IsDc, $Exists, $Description, $HasPassword, $Action, $Tag, $Mentions) {
            $plan = Get-AccountPlan -IsDomainController $IsDc -Exists $Exists -Description $Description `
              -HasPassword $HasPassword -AccountName "fivenines-agent" -ComputerName "DC1"
            $label = "dc=$IsDc exists=$Exists description='$Description' password=$HasPassword"
            if ($plan.Action -ne $Action -or $plan.Description -ne $Tag) {
              Write-Host "FAIL $label -> $($plan.Action) '$($plan.Description)', expected $Action '$Tag'"
              $script:failed++
            } elseif ($Action -eq "Refuse" -and -not ($plan.Message -like "*$Mentions*")) {
              Write-Host "FAIL $label -> message does not mention '$Mentions': $($plan.Message)"
              $script:failed++
            } else {
              Write-Host "ok   $label -> $Action"
            }
          }

          # Member server / workgroup: the behavior every release had.
          Check $false $false ""                       $false "Create"      $MSI_MANAGED_DESCRIPTION $null
          Check $false $false ""                       $true  "Create"      $MSI_MANAGED_DESCRIPTION $null
          Check $false $true  $MSI_MANAGED_DESCRIPTION $false "Rotate"      $null $null
          Check $false $true  $MSI_MANAGED_DESCRIPTION $true  "UseProvided" $null $null
          Check $false $true  "Ansible-managed"        $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"
          Check $false $true  "Ansible-managed"        $true  "UseProvided" $null $null
          Check $false $true  ""                       $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"

          # Domain controller, fresh account: random password -> this DC's
          # tag; operator password -> shared, never rotated.
          Check $true $false ""                        $false "Create"      $own $null
          Check $true $false ""                        $true  "Create"      $DC_OPERATOR_DESCRIPTION $null

          # Domain controller, existing account, no password.
          Check $true $true  $own                      $false "Rotate"      $null $null
          Check $true $true  ($DC_MANAGED_PREFIX + "dc1") $false "Rotate"   $null $null
          Check $true $true  $MSI_MANAGED_DESCRIPTION  $false "Rotate"      $own $null
          Check $true $true  $other                    $false "Refuse"      $null "DC2"
          Check $true $true  $DC_OPERATOR_DESCRIPTION  $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"
          Check $true $true  "Ansible-managed"         $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"
          Check $true $true  ""                        $false "Refuse"      $null "SERVICEACCOUNTPASSWORD"

          # Domain controller, existing account, operator password: an
          # installer-managed account becomes shared so nothing rotates it.
          Check $true $true  $own                      $true  "UseProvided" $DC_OPERATOR_DESCRIPTION $null
          Check $true $true  $other                    $true  "UseProvided" $DC_OPERATOR_DESCRIPTION $null
          Check $true $true  $MSI_MANAGED_DESCRIPTION  $true  "UseProvided" $DC_OPERATOR_DESCRIPTION $null
          Check $true $true  $DC_OPERATOR_DESCRIPTION  $true  "UseProvided" $null $null
          Check $true $true  "Ansible-managed"         $true  "UseProvided" $null $null

          # The uninstall's delete-or-keep rule, every tag on both roles.
          $m = [regex]::Match($uninstall, "(?ms)^function Test-UninstallDeletesAccount \{.*?^\}")
          if (-not $m.Success) { throw "Test-UninstallDeletesAccount not found in fivenines_uninstall.ps1" }
          Invoke-Expression $m.Value
          function CheckUninstall($IsDc, $Description, $Deletes) {
            $got = Test-UninstallDeletesAccount -IsDomainController $IsDc -Description $Description -ComputerName "DC1"
            $label = "uninstall dc=$IsDc description='$Description'"
            if ($got -ne $Deletes) { Write-Host "FAIL $label -> deletes=$got, expected $Deletes"; $script:failed++ }
            else { Write-Host "ok   $label -> deletes=$Deletes" }
          }
          CheckUninstall $false $MSI_MANAGED_DESCRIPTION $true
          CheckUninstall $false "Ansible-managed"        $true
          CheckUninstall $false ""                       $true
          CheckUninstall $true  $own                     $true
          CheckUninstall $true  ($DC_MANAGED_PREFIX + "dc1") $true
          CheckUninstall $true  $MSI_MANAGED_DESCRIPTION $true
          CheckUninstall $true  $other                   $false
          CheckUninstall $true  $DC_OPERATOR_DESCRIPTION $false
          CheckUninstall $true  "Ansible-managed"        $false
          CheckUninstall $true  ""                       $false

          if ($script:failed -gt 0) { throw "$($script:failed) service-account rule case(s) failed" }

      # The WMI Storage namespace delegation, for real on this runner: two
      # grants leave one ACE, the uninstall's removal takes it, and a grant
      # must work while the namespace still carries the ACE of a deleted
      # account (the object-form GetSecurityDescriptor failed on one, which
      # failed a reinstall with 1603 on a domain controller).
      - name: Verify the WMI namespace delegation and its removal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $namespace = "root\Microsoft\Windows\Storage"
          $uninstall = Get-Content fivenines_uninstall.ps1 -Raw
          foreach ($fn in 'Get-WmiNamespaceSD', 'Set-WmiNamespaceSD', 'Remove-WmiStorageGrant') {
            $m = [regex]::Match($uninstall, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in fivenines_uninstall.ps1" }
            Invoke-Expression $m.Value
          }
          function Get-GrantCount($Sid) {
            return @((Get-WmiNamespaceSD $namespace).DiscretionaryAcl | Where-Object {
              $_ -is [System.Security.AccessControl.KnownAce] -and $_.SecurityIdentifier.Value -eq $Sid }).Count
          }
          function New-TestUser($Name) {
            $pw = ConvertTo-SecureString ("Aa1-" + [guid]::NewGuid()) -AsPlainText -Force
            New-LocalUser -Name $Name -Password $pw | Out-Null
            return (Get-LocalUser -Name $Name).SID.Value
          }

          try {
            $first = New-TestUser "fn-wmi-a"
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount "$env:COMPUTERNAME\fn-wmi-a"
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount ".\fn-wmi-a"
            if ((Get-GrantCount $first) -ne 1) { throw "two grants left $(Get-GrantCount $first) ACEs, expected 1" }
            Write-Host "Granted twice: one ACE."

            Remove-LocalUser -Name "fn-wmi-a"
            $second = New-TestUser "fn-wmi-b"
            & windows/installer/DelegateWmiStorageNamespace.ps1 -ServiceAccount "fn-wmi-b"
            if ((Get-GrantCount $second) -ne 1) { throw "the grant over an orphaned ACE did not land" }
            Write-Host "Granted while the namespace carries a deleted account's ACE."

            Remove-WmiStorageGrant $second
            Remove-WmiStorageGrant $first
            if ((Get-GrantCount $second) -ne 0 -or (Get-GrantCount $first) -ne 0) { throw "Remove-WmiStorageGrant left an ACE" }
            Write-Host "Remove-WmiStorageGrant removed both, the orphaned one included."
          } finally {
            Remove-LocalUser -Name "fn-wmi-a" -ErrorAction SilentlyContinue
            Remove-LocalUser -Name "fn-wmi-b" -ErrorAction SilentlyContinue
          }

      # Helpers duplicated across scripts that cannot share a file: the
      # custom actions are separate MSI files, the bootstraps are downloaded
      # one by one.
      - name: Verify duplicated installer helpers stay identical
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          function Get-Fn($path, $fn) {
            $m = [regex]::Match((Get-Content $path -Raw), "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in $path" }
            return $m.Value
          }
          $pairs = @(
            @('Resolve-ServiceAccountSid', 'windows/installer/SetTokenFileAcl.ps1', 'windows/installer/DelegateWmiStorageNamespace.ps1'),
            @('ConvertTo-MsiPasswordArgument', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Get-MsiProductCode', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Invoke-AccountPreflight', 'fivenines_setup.ps1', 'fivenines_update.ps1'),
            @('Get-WinNTUser', 'windows/installer/CreateServiceAccount.ps1', 'fivenines_uninstall.ps1'),
            @('Get-WmiNamespaceSD', 'windows/installer/DelegateWmiStorageNamespace.ps1', 'fivenines_uninstall.ps1'),
            @('Set-WmiNamespaceSD', 'windows/installer/DelegateWmiStorageNamespace.ps1', 'fivenines_uninstall.ps1')
          )
          foreach ($p in $pairs) {
            if ((Get-Fn $p[1] $p[0]) -ne (Get-Fn $p[2] $p[0])) { throw "$($p[0]) differs between $($p[1]) and $($p[2])" }
            Write-Host "$($p[0]): identical in $($p[1]) and $($p[2])"
          }

          # A password the MSI's quoted custom-action command line would split.
          Invoke-Expression (Get-Fn 'fivenines_setup.ps1' 'ConvertTo-MsiPasswordArgument')
          $empty = New-Object System.Security.SecureString
          $bad = @($empty, (ConvertTo-SecureString 'pa"ss' -AsPlainText -Force), (ConvertTo-SecureString 'pass\' -AsPlainText -Force),
                   (ConvertTo-SecureString '-pass' -AsPlainText -Force))
          foreach ($b in $bad) {
            $refused = $false
            try { ConvertTo-MsiPasswordArgument $b | Out-Null } catch { $refused = $true }
            if (-not $refused) { throw "a password that splits the custom action's command line was not refused" }
          }
          $arg = ConvertTo-MsiPasswordArgument (ConvertTo-SecureString 'p a$s\w;rd' -AsPlainText -Force)
          if ($arg -ne 'SERVICEACCOUNTPASSWORD="p a$s\w;rd"') { throw "unexpected msiexec argument: $arg" }
          Write-Host "ConvertTo-MsiPasswordArgument refuses '', a quote, a trailing backslash and a leading '-'."

      - name: Upload Windows coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage-windows.xml
          retention-days: 7

  build-windows-binary:
    name: Build frozen agent (PyInstaller)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools (hash-pinned)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r ci/requirements/build-tools.txt

      - name: Run Windows PyInstaller build
        shell: pwsh
        env:
          TARGET_ARCH: amd64
        run: .\py2exe_windows.ps1

      # windows-ci-* artifact names: called on a tag, this run is also
      # build-release.yml's, whose release job publishes every fivenines-agent-*
      # artifact and whose own Windows build uploads
      # fivenines-agent-windows-amd64 (two uploads of one name fail).
      - name: Upload Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-agent
          path: dist/windows/fivenines-agent-windows-amd64/
          retention-days: 7

  build-msi:
    name: Build MSI installer
    needs: build-windows-binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download agent binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ci-agent
          path: dist/windows/fivenines-agent-windows-amd64/

      - name: Download WinSW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $dst = "dist/windows/WinSW.NET4.exe"
          Invoke-WebRequest -Uri "${{ env.WINSW_URL }}" -OutFile $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash
          Write-Host "Downloaded WinSW v${{ env.WINSW_VERSION }} - SHA256: $hash"
          if ($hash -ne "${{ env.WINSW_SHA256 }}") {
            Write-Error "WinSW SHA256 mismatch: expected ${{ env.WINSW_SHA256 }}, got $hash"
            exit 1
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "${{ env.WIX_VERSION }}"
          wix extension add --global "WixToolset.Util.wixext/${{ env.WIX_VERSION }}"

      - name: Read agent version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "Agent version: $version"
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        working-directory: windows/installer
        run: |
          # AgentBinarySource = the full PyInstaller --onedir output DIR, not
          # just the .exe. The WXS harvests _internal\ from this dir via a
          # Files element; shipping only the exe leaves python311.dll behind
          # and the service fails to start with PYI "module could not be found".
          wix build .\Product.wxs `
            -ext WixToolset.Util.wixext `
            -d "Version=${{ steps.version.outputs.version }}" `
            -d "AgentBinarySource=..\..\dist\windows\fivenines-agent-windows-amd64" `
            -d "WinSwSource=..\..\dist\windows\WinSW.NET4.exe" `
            -d "WinSwConfigSource=..\winsw\fivenines-agent.xml" `
            -arch x64 `
            -o fivenines-agent.msi

      - name: Upload MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ci-msi
          path: windows/installer/fivenines-agent.msi
          retention-days: 30

  smoke-msi:
    name: E2E smoke (install -> service -> report -> uninstall)
    needs: build-msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ci-msi
          path: .

      # A non-English Windows, simulated: its built-in group names are
      # translated (German here), which is what failed the install with 1603
      # for a customer -- the custom actions looked groups up by their English
      # name. Renaming the groups on this English runner reproduces exactly
      # that, so every step below must find them by SID. SYSTEM cannot be
      # renamed; the real German domain-controller run covers it.
      - name: Rename the built-in groups as a German Windows names them
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $names = @{
            "S-1-5-32-558" = "Leistungsueberwachungsbenutzer"
            "S-1-5-32-545" = "Benutzer"
            "S-1-5-32-544" = "Administratoren"
          }
          foreach ($sid in $names.Keys) {
            Rename-LocalGroup -SID $sid -NewName $names[$sid]
            Write-Host "$sid -> $((Get-LocalGroup -SID $sid).Name)"
          }
          if (Get-LocalGroup -Name "Performance Monitor Users" -ErrorAction SilentlyContinue) {
            throw "the English group name still resolves"
          }

      - name: Install MSI silently (fresh-install path - MSI provisions the account)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Real-customer fresh-install scenario: pass only TOKEN. The MSI's
          # CreateServiceAccount CA creates fivenines-agent locally, generates
          # a random password, joins it to Performance Monitor Users + Users,
          # grants SeServiceLogonRight, and flips the service to it.
          $token = "ci-smoke-token-" + (Get-Random)
          $msiArgs = "/i fivenines-agent.msi TOKEN=$token /qn /l*v install.log"
          $p = Start-Process msiexec -ArgumentList $msiArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "msiexec exit code: $($p.ExitCode)"
            Get-Content install.log -Tail 200
            exit 1
          }
          # The verbose log must not carry the token (README; a DC run found
          # it on three lines before the custom-action data was hidden). The
          # log is UTF-16 with a BOM, which ReadAllText decodes.
          if ([System.IO.File]::ReadAllText((Resolve-Path install.log)) -match [regex]::Escape($token)) {
            Write-Error "the TOKEN value is in install.log"
            exit 1
          }

      - name: Verify service account was provisioned by the MSI
        shell: pwsh
        run: |
          $u = Get-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue
          if (-not $u) {
            Write-Error "MSI did not create the 'fivenines-agent' local account"
            exit 1
          }
          Write-Host "Account created: $($u.Name) (Enabled=$($u.Enabled))"
          # Created through the WinNT provider: the flags New-LocalUser used
          # to set must still be there.
          if ($u.PasswordExpires) { Write-Error "password expires: $($u.PasswordExpires)"; exit 1 }
          if ($u.UserMayChangePassword) { Write-Error "the account may change its password"; exit 1 }
          if ($u.AccountExpires) { Write-Error "the account expires: $($u.AccountExpires)"; exit 1 }
          if ($u.Description -ne "Fivenines monitoring agent service account") {
            Write-Error "unexpected Description: '$($u.Description)'"; exit 1
          }

          # By SID, like the installer: the names are translated on a
          # non-English Windows. S-1-5-32-558 = Performance Monitor Users,
          # S-1-5-32-545 = Users.
          foreach ($g in @("S-1-5-32-558", "S-1-5-32-545")) {
            $member = Get-LocalGroupMember -SID $g -ErrorAction SilentlyContinue |
                      Where-Object { $_.SID -eq $u.SID }
            if (-not $member) {
              Write-Error "fivenines-agent is not a member of $g"
              exit 1
            }
            Write-Host "Group membership OK: $g"
          }

          # Confirm the service is configured to log in as the dedicated account,
          # not LocalSystem (the placeholder).
          $svcAccount = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").StartName
          Write-Host "Service runs as: $svcAccount"
          if ($svcAccount -notmatch "fivenines-agent") {
            Write-Error "Service is not running under the dedicated account"
            exit 1
          }

      # Under Windows PowerShell 5.1, the custom actions' runtime: an upgrade
      # re-adds the account to its groups, which must read as "already a
      # member" (matched by HRESULT: the message is translated) through the
      # installer's own helper; and the TOKEN ACL and WMI scripts must resolve
      # every spelling of the MSI's account.
      - name: Verify re-adding the account to its groups and resolving its name
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          Invoke-Expression ([regex]::Match($src, '(?m)^\$HRESULT_MEMBER_IN_ALIAS = .*$').Value)
          foreach ($fn in 'Get-WinNTUser', 'Add-AccountToBuiltinGroup') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }
          foreach ($groupSid in @("S-1-5-32-558", "S-1-5-32-545")) {
            if (Add-AccountToBuiltinGroup -GroupSid $groupSid -AccountName "fivenines-agent") {
              throw "fivenines-agent was not in $groupSid after the install"
            }
            Write-Host "Re-adding to ${groupSid}: already a member, recognized by HRESULT."
          }

          # Get-WinNTUser tells an existing account from a missing one.
          if ($null -eq (Get-WinNTUser "fivenines-agent")) { throw "Get-WinNTUser does not find fivenines-agent" }
          if ($null -ne (Get-WinNTUser "no-such-fivenines-user")) { throw "Get-WinNTUser finds an account that does not exist" }
          Write-Host "Get-WinNTUser: finds fivenines-agent, returns null for a missing account."

          $u = Get-LocalUser -Name "fivenines-agent"
          $m = [regex]::Match((Get-Content windows/installer/SetTokenFileAcl.ps1 -Raw), "(?ms)^function Resolve-ServiceAccountSid \{.*?^\}")
          Invoke-Expression $m.Value
          foreach ($spelling in @("$env:COMPUTERNAME\fivenines-agent", ".\fivenines-agent", "fivenines-agent")) {
            $sid = Resolve-ServiceAccountSid $spelling
            if ($sid -ne $u.SID) { throw "'$spelling' resolved to $sid, expected $($u.SID)" }
            Write-Host "'$spelling' -> $sid"
          }

      - name: Sanity check - install dir has the PyInstaller payload
        shell: pwsh
        run: |
          $installDir = "C:\Program Files\fivenines-agent"
          $pythonDll = Join-Path $installDir "_internal\python311.dll"
          if (-not (Test-Path $pythonDll)) {
            Write-Host "Install dir contents:"
            Get-ChildItem $installDir -Recurse -Depth 1 | Format-Table Mode, Length, Name
            Write-Error "python311.dll missing - MSI did not bundle the PyInstaller _internal\ payload"
            exit 1
          }
          Write-Host "OK: $pythonDll present"

      - name: Verify service is registered and running
        shell: pwsh
        run: |
          $svc = Get-Service -Name "fivenines-agent" -ErrorAction Stop
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne "Running") {
            try {
              Start-Service -Name "fivenines-agent" -ErrorAction Stop
            } catch {
              Write-Host "Start-Service threw: $_"
            }
            Start-Sleep -Seconds 5
            $svc = Get-Service -Name "fivenines-agent"
            Write-Host "Service status after start attempt: $($svc.Status)"
          }
          if ($svc.Status -ne "Running") {
            Write-Host "=== Recent System events ==="
            Get-WinEvent -LogName System -MaxEvents 15 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match "Service Control Manager|fivenines" } |
              Format-List TimeCreated, ProviderName, LevelDisplayName, Message
            Write-Host "=== Recent Application events ==="
            Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, ProviderName, LevelDisplayName, Message
            $logDir = Join-Path $env:ProgramData "fivenines_agent\logs"
            if (Test-Path $logDir) {
              Write-Host "=== WinSW log directory ==="
              Get-ChildItem $logDir | Format-Table
              Get-ChildItem $logDir | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -Tail 50
              }
            }
            Write-Error "Service did not reach Running state"
            exit 1
          }

      - name: Verify TOKEN file ACL is restrictive (F1)
        shell: pwsh
        run: |
          $tokenPath = Join-Path $env:ProgramData "fivenines_agent\TOKEN"
          if (-not (Test-Path $tokenPath)) {
            Write-Error "TOKEN file missing at $tokenPath"
            exit 1
          }
          $acl = Get-Acl $tokenPath
          $principals = $acl.Access | ForEach-Object { $_.IdentityReference.Value }
          Write-Host "TOKEN ACL principals: $($principals -join ', ')"
          # The Users group must NOT have access.
          # By SID: the Users group is renamed above, as on a German Windows.
          $granted = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) |
                       ForEach-Object { $_.IdentityReference.Value })
          if ($granted -contains "S-1-5-32-545" -or $granted -contains "S-1-5-11") {
            Write-Error "TOKEN ACL too permissive - includes Users/Authenticated Users"
            exit 1
          }
          # And it must grant the three principals the installer names, matched
          # by SID: by name, Administrators and SYSTEM failed to resolve on a
          # non-English Windows and were silently left out.
          $sids = @($acl.GetAccessRules($true, $true, [System.Security.Principal.SecurityIdentifier]) |
                    ForEach-Object { $_.IdentityReference.Value })
          foreach ($want in @((Get-LocalUser -Name "fivenines-agent").SID.Value, "S-1-5-32-544", "S-1-5-18")) {
            if ($sids -notcontains $want) {
              Write-Error "TOKEN ACL does not grant $want (SIDs: $($sids -join ', '))"
              exit 1
            }
          }

      # fivenines_update.ps1 -ServiceAccountPassword on the version already
      # installed: the MSI alone would run in maintenance mode, never reach
      # the account and report success. The bootstrap checks the account
      # first (the MSI's own CreateServiceAccount.ps1 -PlanOnly, extracted by
      # an administrative install), refusing a wrong password before touching
      # anything, then applies a right one with that same account step and
      # restarts the service -- no msiexec run, nothing removed.
      - name: fivenines_update.ps1 -ServiceAccountPassword, wrong then right, on the installed version
        shell: powershell
        # Bootstrap scripts run msiexec /qb, whose modal error box would hold
        # the job for GitHub's six hours.
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $msiUrl = "file:///" + (Resolve-Path fivenines-agent.msi).Path.Replace('\', '/')
          $token = (Get-Content (Join-Path $env:ProgramData "fivenines_agent\TOKEN") -Raw).Trim()
          function Invoke-Update($Password, $Log) {
            $secure = ConvertTo-SecureString $Password -AsPlainText -Force
            $global:LASTEXITCODE = 0
            & .\fivenines_update.ps1 -MsiUrl $msiUrl -MsiPath (Join-Path $env:TEMP "fn-update.msi") -LogFile (Join-Path $PWD $Log) -ServiceAccountPassword $secure
            if ($LASTEXITCODE -ne 0) { throw "fivenines_update.ps1 exited $LASTEXITCODE" }
          }
          function Assert-Installed {
            $agent = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
                     Where-Object { $_.DisplayName -match "Fivenines Monitoring Agent" }
            if (-not $agent) { throw "the agent is no longer installed" }
            for ($i = 0; $i -lt 30; $i++) {
              if ((Get-Service -Name "fivenines-agent").Status -eq "Running") { return }
              Start-Sleep -Seconds 2
            }
            throw "the service is not Running"
          }

          $refused = $null
          try { Invoke-Update ("Wrong-" + [guid]::NewGuid()) "update-wrong.log" } catch { $refused = "$_" }
          if (-not $refused -or $refused -notmatch "does not log") { throw "a wrong password was not refused before msiexec: $refused" }
          if (Test-Path "update-wrong.log") { throw "msiexec ran although the preflight refused" }
          Assert-Installed
          Write-Host "Wrong password refused before msiexec; the agent is still installed and Running."

          $password = 'Fn9 r$i;ght\pw_' + (Get-Random)
          Set-LocalUser -Name "fivenines-agent" -Password (ConvertTo-SecureString $password -AsPlainText -Force)
          Invoke-Update $password "update-right.log"
          Assert-Installed
          Restart-Service -Name "fivenines-agent"
          Assert-Installed
          if (Test-Path "update-right.log") { throw "msiexec ran although this version was already installed" }
          foreach ($log in Get-ChildItem -Filter "*.log") {
            $text = [System.IO.File]::ReadAllText($log.FullName)
            if ($text.Contains($password)) { throw "the password is in $($log.Name)" }
            if ($text.Contains($token)) { throw "the TOKEN value is in $($log.Name)" }
          }
          Write-Host "Right password applied to the installed agent by the MSI's own account step; the service restarts with it; no secret in any log."

      - name: Uninstall MSI silently
        shell: pwsh
        run: |
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall.log" -Wait

      - name: Verify uninstall removed service + config dir
        shell: pwsh
        run: |
          $svc = Get-Service -Name "fivenines-agent" -ErrorAction SilentlyContinue
          if ($null -ne $svc) {
            Write-Error "Service still registered after uninstall"
            exit 1
          }
          $configDir = Join-Path $env:ProgramData "fivenines_agent"
          if (Test-Path $configDir) {
            Write-Warning "Config dir survived uninstall: $configDir"
            Get-ChildItem $configDir -Recurse | Out-String
          }

      # Three installs over what earlier ones left, then the uninstall script:
      # 1. the account kept (an upgrade or reinstall): Rotate, through WinNT
      #    SetPassword, on a local SAM -- the DC run is the only other place
      #    it runs;
      # 2. the account deleted by hand, so its ACE on the WMI Storage
      #    namespace names a SID that no longer resolves: the WMI delegation
      #    must cope (GetSecurityDescriptor failed outright on one, which a
      #    domain controller showed). That install passes the password, one
      #    with a space, a '-', '$', ';' and an inner '\', as an operator
      #    would: the service runs only if it reached sc.exe intact;
      # 3. fivenines_uninstall.ps1 must delete the account and its grant.
      - name: Reinstall keeping the account, over an orphaned WMI grant, then fivenines_uninstall.ps1
        shell: powershell
        # Bootstrap scripts run msiexec /qb, whose modal error box would hold
        # the job for GitHub's six hours.
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          $src = Get-Content windows/installer/DelegateWmiStorageNamespace.ps1 -Raw
          Invoke-Expression ([regex]::Match($src, "(?ms)^function Get-WmiNamespaceSD \{.*?^\}").Value)
          function Get-StorageAceSids {
            $sd = Get-WmiNamespaceSD "root\Microsoft\Windows\Storage"
            return @($sd.DiscretionaryAcl | Where-Object { $_ -is [System.Security.AccessControl.KnownAce] } |
                     ForEach-Object { $_.SecurityIdentifier.Value })
          }
          function Install-Msi($Log, $Extra, $Secret) {
            $token = "ci-reinstall-$(Get-Random)"
            $arguments = "/i fivenines-agent.msi TOKEN=$token /qn /l*v $Log $Extra"
            $p = Start-Process msiexec -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Get-Content $Log | Select-String "WixQuietExec" | Where-Object { $_.Line -notmatch "powershell\.exe" } |
                Select-Object -Last 40 | ForEach-Object { $_.Line }
              throw "msiexec ($Log) failed: $($p.ExitCode)"
            }
            $text = [System.IO.File]::ReadAllText((Resolve-Path $Log))
            if ($text.Contains($token)) { throw "the TOKEN value is in $Log" }
            if ($Secret -and $text.Contains($Secret)) { throw "the service account password is in $Log" }
          }
          function Wait-Running {
            for ($i = 0; $i -lt 30; $i++) {
              if ((Get-Service -Name "fivenines-agent" -ErrorAction SilentlyContinue).Status -eq "Running") { return }
              Start-Sleep -Seconds 2
            }
            throw "the service did not reach Running"
          }

          # 1. Rotate.
          $kept = Get-LocalUser -Name "fivenines-agent"
          Install-Msi "rotate.log" ""
          Wait-Running
          $after = Get-LocalUser -Name "fivenines-agent"
          if ($after.SID -ne $kept.SID) { throw "the reinstall replaced the account instead of rotating it" }
          if ($after.Description -ne $kept.Description) { throw "the reinstall retagged a member server's account: '$($after.Description)'" }
          if (-not $after.PasswordLastSet -or $after.PasswordLastSet -le $kept.PasswordLastSet) { throw "the password was not rotated" }
          Write-Host "Reinstalled over the kept account: rotated, same SID and tag, service Running."
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall-rotate.log" -Wait | Out-Null

          # 2. Orphaned grant, operator password.
          $orphan = $after.SID.Value
          Remove-LocalUser -Name "fivenines-agent"
          if ((Get-StorageAceSids) -notcontains $orphan) { throw "expected the deleted account's WMI grant to remain" }
          Write-Host "Deleted fivenines-agent by hand; its WMI grant ($orphan) remains."
          $password = 'Fn9 -p$a;ss\w0rd_' + (Get-Random)
          Install-Msi "reinstall.log" ('SERVICEACCOUNTPASSWORD="{0}"' -f $password) $password
          Wait-Running
          $sid = (Get-LocalUser -Name "fivenines-agent").SID.Value
          $count = @(Get-StorageAceSids | Where-Object { $_ -eq $sid }).Count
          if ($count -ne 1) { throw "expected exactly one WMI grant for $sid, found $count" }
          Write-Host "Reinstalled as $sid with the operator's password, granted once, service Running."

          # 3. The uninstall script.
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall2.log" -Wait | Out-Null
          & .\fivenines_uninstall.ps1 -LogFile uninstall-script.log
          if (Get-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue) { throw "fivenines_uninstall.ps1 kept the account" }
          if ((Get-StorageAceSids) -contains $sid) { throw "fivenines_uninstall.ps1 left the WMI grant for $sid" }
          Write-Host "fivenines_uninstall.ps1 deleted the account and its WMI grant."

      - name: Cleanup service account
        if: always()
        shell: pwsh
        run: Remove-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue

      - name: Upload install/uninstall logs (on failure or always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-logs
          path: |
            install.log
            uninstall.log
            rotate.log
            uninstall-rotate.log
            reinstall.log
            uninstall2.log
          retention-days: 7
          if-no-files-found: ignore

  # Whether this push changed what the domain-controller E2E tests: the MSI
  # sources, the bootstrap scripts, the DC harness or this workflow. Compared
  # with the commit the push replaced; a new branch (or a force push whose old
  # head is gone) is compared with where it left main. Never on a tag: the tag
  # names a main commit whose own push already ran it.
  installer-changed:
    name: Installer changed?
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare with the previous head
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base origin/main HEAD)
            if [ "$base" = "$(git rev-parse HEAD)" ]; then
              base=$(git rev-parse HEAD^)
            fi
          fi
          echo "Comparing ${base} with $(git rev-parse HEAD)"
          files=$(git diff --name-only "$base" HEAD)
          if printf '%s\n' "$files" | grep -E '^(windows/installer/|ci/windows-dc/|fivenines_(setup|update|uninstall)\.ps1$|\.github/workflows/windows\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No installer file changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # The MSI on real domain controllers, which no GitHub runner can become
  # (promotion needs a reboot): a Windows Server 2019 evaluation VM in
  # QEMU/KVM on a Linux runner, installed in English and in German, promoted
  # to the first DC of a new forest. It first reproduces the failure a trial
  # reported with v1.22.0, then plays every account scenario a DC meets
  # (ci/windows-dc/stage2.ps1). About an hour, so it runs only on a push that
  # changed the installer (installer-changed above), or on request:
  #   gh workflow run windows.yml --ref <branch> -f domain_controller=true
  # A release never waits for it: it downloads Microsoft's evaluation ISOs,
  # which can change or disappear without any change here.
  smoke-msi-domain-controller:
    name: E2E on a domain controller (Server 2019 ${{ matrix.lang }})
    needs: [build-msi, installer-changed]
    if: >-
      ${{ !cancelled() && needs.build-msi.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.domain_controller) ||
      (github.event_name == 'push' && needs.installer-changed.outputs.changed == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          # Microsoft's evaluation ISOs (go.microsoft.com/fwlink LinkID
          # 2195167); Microsoft publishes no checksum for them, so these are
          # the SHA-256 of two identical downloads, 2026-11-03.
          - lang: en-US
            culture: en-us
            clcid: "0x409"
            country: US
            iso_sha256: 6dae072e7f78f4ccab74a45341de0d6e2d45c39be25f1f5920a2ab4f51d7bcbb
          - lang: de-DE
            culture: de-de
            clcid: "0x407"
            country: DE
            iso_sha256: 82115b58c188847a79f70c3b46841c675d66c9fe259c8722e23ddf6197042624
    env:
      # The last release before domain-controller support, whose 1603 on a DC
      # the run reproduces first; checksum from that release's signed
      # SHA256SUMS.
      OLD_MSI_URL: https://github.com/Five-Nines-io/fivenines_agent/releases/download/v1.22.0/fivenines-agent-windows-amd64.msi
      OLD_MSI_SHA256: 0307513ecd13ac4530241e97f82df55789ee1cf78a36a63cc50740f774c1291c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-ci-msi
          path: msi

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils genisoimage wimtools socat ntfs-3g

      - name: Enable KVM access
        run: |
          ls -la /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Download the evaluation ISO and v1.22.0's MSI (checksums verified)
        env:
          CULTURE: ${{ matrix.culture }}
          CLCID: ${{ matrix.clcid }}
          COUNTRY: ${{ matrix.country }}
          ISO_SHA256: ${{ matrix.iso_sha256 }}
        run: |
          sudo mkdir -p /mnt/fn
          sudo chown "$(id -u):$(id -g)" /mnt/fn
          curl -fsSL --retry 3 -o /mnt/fn/server.iso \
            "https://go.microsoft.com/fwlink/p/?LinkID=2195167&clcid=${CLCID}&culture=${CULTURE}&country=${COUNTRY}"
          echo "${ISO_SHA256}  /mnt/fn/server.iso" | sha256sum -c -
          curl -fsSL --retry 3 -o /mnt/fn/old.msi "$OLD_MSI_URL"
          echo "${OLD_MSI_SHA256}  /mnt/fn/old.msi" | sha256sum -c -

      - name: Install, promote and test the domain controller
        env:
          LANG_TAG: ${{ matrix.lang }}
        run: |
          ci/windows-dc/run-vm.sh /mnt/fn/server.iso "$LANG_TAG" msi/fivenines-agent.msi /mnt/fn/old.msi /mnt/fn/out

      - name: Upload the VM's serial log, screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: domain-controller-${{ matrix.lang }}
          path: /mnt/fn/out
          retention-days: 7
          if-no-files-found: ignore
