name: Windows Build

# Windows CI for the agent: tests, frozen-binary build, MSI build, and the
# end-to-end install smoke (D14 + D20 - CI is the quality gate for the
# single combined release).
#
# Coverage handling per D3: the per-OS pytest run uses --cov but NOT
# --cov-fail-under (Windows alone cannot reach 100% because Linux-only
# branches are unreachable here, and vice versa on the Linux CI in
# build-release.yml). The combined-coverage gate that merges both OS runs
# is a follow-up; tracked in TODOS.md. For now, the per-OS coverage XML is
# uploaded as an artifact so it can be aggregated externally.

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'spuyet/windows-server-support'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Nothing here writes to the repository, whatever the default token allows.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  # Poetry and the other build tools are pinned, with hashes, in
  # ci/requirements/build-tools.txt.
  # WiX 5+ - need the <Files> harvesting element, which WiX 4 does not have.
  # Pinned to a stable 5.x so the schema we author against stays predictable;
  # WiX 6/7 introduce further changes (e.g. some default behavior shifts).
  WIX_VERSION: '5.0.2'
  # WinSW v2 (.NET Framework 4 - in-box on Server 2019/2022/2025 + Win 10/11)
  WINSW_VERSION: '2.12.0'
  WINSW_URL: 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW.NET4.exe'
  # SHA256 of WinSW.NET4.exe v2.12.0 published binary. Verified against the
  # GitHub release artifact via multiple consecutive green CI runs.
  WINSW_SHA256: '923111C7142B3DC783A3C722B19B8A21BCB78222D7A136AC33F0CA8A29F4CB66'

jobs:
  test-windows:
    name: Tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools (hash-pinned)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r ci/requirements/build-tools.txt

      - name: Install dependencies (windows group, virtualization excluded)
        shell: pwsh
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --without virtualization --with windows --with test

      - name: Run tests with coverage (no fail-under per D3)
        shell: pwsh
        run: |
          poetry run pytest tests/ `
            --cov=fivenines_agent `
            --cov-report=xml:coverage-windows.xml `
            --cov-report=term-missing

      # The MSI's password generator, exercised against the real PowerShell.
      # The bug this guards used to fail roughly one install in 770 - rare
      # enough to look like CI flake, frequent enough to be a customer's
      # failed install - and the E2E smoke job that eventually caught it only
      # runs after the MSI is built, so it never fenced the generator itself.
      # The function is extracted rather than dot-sourced because the script
      # is a custom action with mandatory parameters and Windows-only cmdlets.
      - name: Verify service-account password generation
        shell: pwsh
        run: |
          $src = Get-Content windows/installer/CreateServiceAccount.ps1 -Raw
          foreach ($fn in 'Get-RandomIndex', 'Get-RandomChar', 'New-RandomPassword') {
            $m = [regex]::Match($src, "(?ms)^function $fn \{.*?^\}")
            if (-not $m.Success) { throw "$fn not found in CreateServiceAccount.ps1" }
            Invoke-Expression $m.Value
          }

          # New-LocalUser enforces the machine password policy, which wants at
          # least three of {upper, lower, digit, non-alphanumeric}. Assert all
          # four on every draw, so a regression cannot reintroduce a rare miss.
          $seen = @{}
          for ($i = 0; $i -lt 2000; $i++) {
            $pw = New-RandomPassword
            if ($pw.Length -ne 32) { throw "length $($pw.Length), expected 32: $pw" }
            if ($pw -notmatch '[A-Z]')      { throw "no uppercase: $pw" }
            if ($pw -notmatch '[a-z]')      { throw "no lowercase: $pw" }
            if ($pw -notmatch '[0-9]')      { throw "no digit: $pw" }
            if ($pw -notmatch '[-_]')       { throw "no non-alphanumeric: $pw" }
            if ($pw -match '[^A-Za-z0-9_-]') { throw "character outside the sc.exe-safe alphabet: $pw" }
            $seen[$pw] = $true
          }
          if ($seen.Count -ne 2000) { throw "generated a duplicate password in 2000 draws" }

          # The guaranteed characters must not sit in a fixed order at the
          # front: that would leak four positions of the password's structure.
          $firstDigitPositions = @{}
          for ($i = 0; $i -lt 500; $i++) {
            $firstDigitPositions[(New-RandomPassword).IndexOfAny('0123456789'.ToCharArray())] = $true
          }
          if ($firstDigitPositions.Count -lt 10) {
            throw "first digit landed in only $($firstDigitPositions.Count) distinct positions - is the shuffle running?"
          }

          Write-Host "2000 passwords: length 32, all four character classes, no duplicates, shuffled."

      - name: Upload Windows coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-windows
          path: coverage-windows.xml
          retention-days: 7

  build-windows-binary:
    name: Build frozen agent (PyInstaller)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools (hash-pinned)
        shell: pwsh
        run: |
          python -m pip install --require-hashes --no-deps --only-binary :all: -r ci/requirements/build-tools.txt

      - name: Run Windows PyInstaller build
        shell: pwsh
        env:
          TARGET_ARCH: amd64
        run: .\py2exe_windows.ps1

      - name: Upload Windows binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fivenines-agent-windows-amd64
          path: dist/windows/fivenines-agent-windows-amd64/
          retention-days: 7

  build-msi:
    name: Build MSI installer
    needs: build-windows-binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download agent binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fivenines-agent-windows-amd64
          path: dist/windows/fivenines-agent-windows-amd64/

      - name: Download WinSW
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $dst = "dist/windows/WinSW.NET4.exe"
          Invoke-WebRequest -Uri "${{ env.WINSW_URL }}" -OutFile $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash
          Write-Host "Downloaded WinSW v${{ env.WINSW_VERSION }} - SHA256: $hash"
          if ($hash -ne "${{ env.WINSW_SHA256 }}") {
            Write-Error "WinSW SHA256 mismatch: expected ${{ env.WINSW_SHA256 }}, got $hash"
            exit 1
          }

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version "${{ env.WIX_VERSION }}"
          wix extension add --global "WixToolset.Util.wixext/${{ env.WIX_VERSION }}"

      - name: Read agent version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                      ForEach-Object { $_.Matches[0].Groups[1].Value })
          Write-Host "Agent version: $version"
          "version=$version" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT

      - name: Build MSI
        shell: pwsh
        working-directory: windows/installer
        run: |
          # AgentBinarySource = the full PyInstaller --onedir output DIR, not
          # just the .exe. The WXS harvests _internal\ from this dir via a
          # Files element; shipping only the exe leaves python311.dll behind
          # and the service fails to start with PYI "module could not be found".
          wix build .\Product.wxs `
            -ext WixToolset.Util.wixext `
            -d "Version=${{ steps.version.outputs.version }}" `
            -d "AgentBinarySource=..\..\dist\windows\fivenines-agent-windows-amd64" `
            -d "WinSwSource=..\..\dist\windows\WinSW.NET4.exe" `
            -d "WinSwConfigSource=..\winsw\fivenines-agent.xml" `
            -arch x64 `
            -o fivenines-agent.msi

      - name: Upload MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fivenines-agent-msi
          path: windows/installer/fivenines-agent.msi
          retention-days: 30

  smoke-msi:
    name: E2E smoke (install -> service -> report -> uninstall)
    needs: build-msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fivenines-agent-msi
          path: .

      - name: Install MSI silently (fresh-install path - MSI provisions the account)
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Real-customer fresh-install scenario: pass only TOKEN. The MSI's
          # CreateServiceAccount CA creates fivenines-agent locally, generates
          # a random password, joins it to Performance Monitor Users + Users,
          # grants SeServiceLogonRight, and flips the service to it.
          $token = "ci-smoke-token-" + (Get-Random)
          $msiArgs = "/i fivenines-agent.msi TOKEN=$token /qn /l*v install.log"
          $p = Start-Process msiexec -ArgumentList $msiArgs -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "msiexec exit code: $($p.ExitCode)"
            Get-Content install.log -Tail 200
            exit 1
          }

      - name: Verify service account was provisioned by the MSI
        shell: pwsh
        run: |
          $u = Get-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue
          if (-not $u) {
            Write-Error "MSI did not create the 'fivenines-agent' local account"
            exit 1
          }
          Write-Host "Account created: $($u.Name) (Enabled=$($u.Enabled))"

          $groups = @("Performance Monitor Users", "Users")
          foreach ($g in $groups) {
            $member = Get-LocalGroupMember -Group $g -ErrorAction SilentlyContinue |
                      Where-Object { $_.Name -match "fivenines-agent" }
            if (-not $member) {
              Write-Error "fivenines-agent is not a member of '$g'"
              exit 1
            }
            Write-Host "Group membership OK: $g"
          }

          # Confirm the service is configured to log in as the dedicated account,
          # not LocalSystem (the placeholder).
          $svcAccount = (Get-CimInstance Win32_Service -Filter "Name='fivenines-agent'").StartName
          Write-Host "Service runs as: $svcAccount"
          if ($svcAccount -notmatch "fivenines-agent") {
            Write-Error "Service is not running under the dedicated account"
            exit 1
          }

      - name: Sanity check - install dir has the PyInstaller payload
        shell: pwsh
        run: |
          $installDir = "C:\Program Files\fivenines-agent"
          $pythonDll = Join-Path $installDir "_internal\python311.dll"
          if (-not (Test-Path $pythonDll)) {
            Write-Host "Install dir contents:"
            Get-ChildItem $installDir -Recurse -Depth 1 | Format-Table Mode, Length, Name
            Write-Error "python311.dll missing - MSI did not bundle the PyInstaller _internal\ payload"
            exit 1
          }
          Write-Host "OK: $pythonDll present"

      - name: Verify service is registered and running
        shell: pwsh
        run: |
          $svc = Get-Service -Name "fivenines-agent" -ErrorAction Stop
          Write-Host "Service status: $($svc.Status)"
          if ($svc.Status -ne "Running") {
            try {
              Start-Service -Name "fivenines-agent" -ErrorAction Stop
            } catch {
              Write-Host "Start-Service threw: $_"
            }
            Start-Sleep -Seconds 5
            $svc = Get-Service -Name "fivenines-agent"
            Write-Host "Service status after start attempt: $($svc.Status)"
          }
          if ($svc.Status -ne "Running") {
            Write-Host "=== Recent System events ==="
            Get-WinEvent -LogName System -MaxEvents 15 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match "Service Control Manager|fivenines" } |
              Format-List TimeCreated, ProviderName, LevelDisplayName, Message
            Write-Host "=== Recent Application events ==="
            Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, ProviderName, LevelDisplayName, Message
            $logDir = Join-Path $env:ProgramData "fivenines_agent\logs"
            if (Test-Path $logDir) {
              Write-Host "=== WinSW log directory ==="
              Get-ChildItem $logDir | Format-Table
              Get-ChildItem $logDir | ForEach-Object {
                Write-Host "--- $($_.Name) ---"
                Get-Content $_.FullName -Tail 50
              }
            }
            Write-Error "Service did not reach Running state"
            exit 1
          }

      - name: Verify TOKEN file ACL is restrictive (F1)
        shell: pwsh
        run: |
          $tokenPath = Join-Path $env:ProgramData "fivenines_agent\TOKEN"
          if (-not (Test-Path $tokenPath)) {
            Write-Error "TOKEN file missing at $tokenPath"
            exit 1
          }
          $acl = Get-Acl $tokenPath
          $principals = $acl.Access | ForEach-Object { $_.IdentityReference.Value }
          Write-Host "TOKEN ACL principals: $($principals -join ', ')"
          # The Users group must NOT have access.
          if ($principals -match "BUILTIN\\Users" -or $principals -match "Authenticated Users") {
            Write-Error "TOKEN ACL too permissive - includes Users/Authenticated Users"
            exit 1
          }

      - name: Uninstall MSI silently
        shell: pwsh
        run: |
          Start-Process msiexec -ArgumentList "/x fivenines-agent.msi /qn /l*v uninstall.log" -Wait

      - name: Verify uninstall removed service + config dir
        shell: pwsh
        run: |
          $svc = Get-Service -Name "fivenines-agent" -ErrorAction SilentlyContinue
          if ($null -ne $svc) {
            Write-Error "Service still registered after uninstall"
            exit 1
          }
          $configDir = Join-Path $env:ProgramData "fivenines_agent"
          if (Test-Path $configDir) {
            Write-Warning "Config dir survived uninstall: $configDir"
            Get-ChildItem $configDir -Recurse | Out-String
          }

      - name: Cleanup service account
        if: always()
        shell: pwsh
        run: Remove-LocalUser -Name "fivenines-agent" -ErrorAction SilentlyContinue

      - name: Upload install/uninstall logs (on failure or always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-logs
          path: |
            install.log
            uninstall.log
          retention-days: 7
          if-no-files-found: ignore
