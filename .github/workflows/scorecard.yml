name: Scorecard

# OpenSSF Scorecard: repository and supply-chain practices, scored per check.
# publish_results makes the result public at
# https://scorecard.dev/viewer/?uri=github.com/Five-Nines-io/fivenines_agent
# and feeds the README badge. Publishing restricts this workflow's shape: no
# top-level write permissions or env, and no `run:` steps in the job.
on:
  # Re-score when branch protection changes (the Branch-Protection check).
  branch_protection_rule:
  schedule:
    - cron: '41 6 * * 2'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the findings to code scanning.
      security-events: write
      # Publish the results and the badge.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
